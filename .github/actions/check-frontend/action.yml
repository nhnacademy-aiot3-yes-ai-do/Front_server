name: Check React frontend
description: Install the pinned Node.js toolchain and verify the React application

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22.22.1"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: npm ci

    - name: Check frontend formatting
      shell: bash
      working-directory: frontend
      run: npm run format:check

    - name: Lint frontend
      shell: bash
      working-directory: frontend
      run: npm run lint

    - name: Test frontend
      shell: bash
      working-directory: frontend
      run: npm run test
