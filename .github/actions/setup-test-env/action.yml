name: Setup test environment
description: Configure non-production Front Server settings for CI tests

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # CI-only placeholders: these are not production OAuth credentials.
        echo "GOOGLE_CLIENT_ID=ci-google-client-id" >> "$GITHUB_ENV"
        echo "GOOGLE_SECRET=ci-google-client-secret" >> "$GITHUB_ENV"
        echo "GOOGLE_REDIRECT_URI=http://localhost:8080/login/oauth2/code/google" >> "$GITHUB_ENV"

        # Tests must not issue Secure cookies over the GitHub runner's HTTP test requests.
        echo "COOKIE_SECURE=false" >> "$GITHUB_ENV"
        echo "AUTH_COOKIE_SECURE=false" >> "$GITHUB_ENV"

        # Front tests mock upstream calls; disable any accidental external dependency.
        echo "GATEWAY_URL=http://localhost:8080" >> "$GITHUB_ENV"
