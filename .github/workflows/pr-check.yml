name: pr-check

on:
  pull_request:
    branches: [develop, main]

jobs:
  test-and-coverage:
    uses: ./.github/workflows/_reusable-test.yml

  docker-build:
    needs: test-and-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Docker image build test (no push)
        run: docker build -t front-service:pr-test .
