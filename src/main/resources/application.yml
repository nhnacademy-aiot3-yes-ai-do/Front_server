server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: ${COOKIE_HTTP_ONLY:true}
        secure: ${COOKIE_SECURE:true}
  shutdown: graceful
  tomcat:
    keep-alive-timeout: 100000

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: front_server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - openid
              - email
              - profile
  lifecycle:
    timeout-per-shutdown-phase: 20s
  session:
    store-type: redis
    timeout: 10m
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
    domain: ${AUTH_COOKIE_DOMAIN:}

feign:
  client:
    gateway:
      url: ${GATEWAY_URL:http://localhost:8080}

# seed 순서(TELEGRAM, DISCORD) 기준 기본값. 채널 타입 목록 API가 생기면 교체.
notification:
  discord:
    channel-type-id: ${NOTIFICATION_DISCORD_CHANNEL_TYPE_ID:2}

logging:
  level:
    site.yesaido.frontserver.logging.FrontResponseLoggingAspect: INFO
