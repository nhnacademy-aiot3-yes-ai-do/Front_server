server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: front_server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

feign:
  client:
    gateway:
      url: ${GATEWAY_URL:http://localhost:8080}