<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재배지 생성 | MushMush</title>
    <link rel="stylesheet" href="/css/cultivation-create.css" />
    <script src="/js/lucide.js"></script>
    <script src="/js/common.js"></script>
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="wizard-page">
    <div class="wizard-box">

        <div class="wizard-steps">
            <div class="wizard-step active" id="stepnav-1">
                <span class="step-num">1</span>
                <span class="step-label">재배지 정보</span>
            </div>
            <span class="step-line"></span>
            <div class="wizard-step" id="stepnav-2">
                <span class="step-num">2</span>
                <span class="step-label">센서 선택</span>
            </div>
            <span class="step-line"></span>
            <div class="wizard-step" id="stepnav-3">
                <span class="step-num">3</span>
                <span class="step-label">환경 분석</span>
            </div>
            <span class="step-line"></span>
            <div class="wizard-step" id="stepnav-4">
                <span class="step-num">4</span>
                <span class="step-label">추천 환경</span>
            </div>
        </div>

        <div class="wizard-panels">

            <!-- STEP 1 : 재배지 정보 입력 -->
            <section class="wizard-panel active" id="step-1">
                <h2 class="wizard-title">재배지 정보를 입력해주세요</h2>
                <p class="wizard-desc">새로 시작할 재배지의 기본 정보를 알려주세요.</p>

                <div class="form-grid">
                    <div class="form-field">
                        <label>재배지 이름</label>
                        <input type="text" id="f-name" placeholder="예: 양송이 1번 재배지" />
                    </div>
                    <div class="form-field">
                        <label>버섯 종류</label>
                        <select id="f-mushroom"></select>
                    </div>
                    <div class="form-field">
                        <label>재배 시작일</label>
                        <input type="date" id="f-start" />
                    </div>
                    <div class="form-field">
                        <label>재배 장소</label>
                        <input type="text" id="f-place" placeholder="예: 우리 집 재배실" />
                    </div>
                </div>

                <div class="wizard-actions">
                    <button class="step-next" type="button" onclick="goToStep(2)" title="다음">
                        <i data-lucide="circle-arrow-right"></i>
                    </button>
                </div>
            </section>

            <!-- STEP 2 : 센서 선택 -->
            <section class="wizard-panel" id="step-2">
                <h2 class="wizard-title">사용할 센서를 선택해주세요</h2>
                <p class="wizard-desc">이미 등록해두신 센서 중, 이 재배지에서 사용할 센서를 골라주세요.</p>

                <div class="sensor-select-list" id="sensor-select-list"></div>

                <div class="wizard-actions wizard-actions-split">
                    <button class="step-next" type="button" onclick="goToStep(1)" title="이전">
                        <i data-lucide="circle-arrow-left"></i>
                    </button>
                    <button class="step-next" type="button" onclick="goToStep(3)" title="다음">
                        <i data-lucide="circle-arrow-right"></i>
                    </button>
                </div>
            </section>

            <!-- STEP 3 : 로딩 (AI 환경 분석) -->
            <section class="wizard-panel" id="step-3">
                <div class="loading-wrap">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">AI가 <span id="loading-mushroom">양송이버섯</span> 재배에<br />최적인 환경을 분석하고 있어요...</p>
                </div>
            </section>

            <!-- STEP 4 : AI 추천 환경 -->
            <section class="wizard-panel" id="step-4">
                <h2 class="wizard-title">
                    AI가 추천한 <span id="result-mushroom">양송이버섯</span> 재배 최적의 환경입니다
                </h2>
                <p class="wizard-desc">필요하다면 값을 직접 수정할 수 있어요. 같은 종류의 센서를 여러 개 골랐다면 센서마다 따로 설정할 수 있어요.</p>

                <div class="step4-columns">
                    <div class="step4-col-left">
                        <div class="mushroom-info-card" id="mushroom-info-card">
                            <div class="mushroom-info-title">
                                <i data-lucide="sparkles"></i><span id="mushroom-info-name">양송이버섯</span>의 효능
                            </div>
                            <ul class="mushroom-info-list" id="mushroom-info-list"></ul>
                        </div>
                    </div>
                    <div class="step4-col-right">
                        <div class="recommend-grid" id="recommend-grid"></div>
                    </div>
                </div>

                <div class="wizard-actions wizard-actions-split">
                    <button class="step-next" type="button" onclick="goToStep(2)" title="이전">
                        <i data-lucide="circle-arrow-left"></i>
                    </button>
                    <button class="btn btn-primary" type="button" onclick="finishCultivation()">
                        <i data-lucide="check"></i>재배 시작하기
                    </button>
                </div>
            </section>

        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    var MUSHROOMS = []; // 서버에서 조회한 mushroom_reference 목록 (thresholdInfoResponses 포함)

    // 프론트 표시용 한글 라벨 ↔ 백엔드 SensorType.type 매핑
    // (센서 등록 화면은 아직 더미라 한글 라벨을 그대로 쓰고 있어서 여기서 변환)
    var KOREAN_TO_SENSOR_TYPE = {
        '온도': 'TEMPERATURE',
        '습도': 'HUMIDITY',
        'CO2': 'CO2',
        '조도': 'LIGHT'
    };

    // 이미 등록된 센서 목록 (데모 데이터) - 실제로는 서버에서 조회
    var REGISTERED_SENSORS = [
        { id: 1, type: '온도', icon: 'thermometer', place: '1번 선반', model: 'TH-1001' },
        { id: 2, type: '습도', icon: 'droplet', place: '1번 선반', model: 'HD-2002' },
        { id: 3, type: 'CO2', icon: 'cloudy', place: '2번 선반', model: 'CO-3003' },
        { id: 4, type: '조도', icon: 'sun', place: '2번 선반', model: 'LX-4004' },
        { id: 5, type: '온도', icon: 'thermometer', place: '3번 선반', model: 'TH-1005' }
    ];
    var selectedSensorIds = [];

    // 등록된 버섯에 값이 없는 센서타입일 때 쓰는 폴백 기본값
    var SENSOR_TYPE_FALLBACK = {
        '온도': { max: 22, min: 16, unit: '°C', icon: 'thermometer' },
        '습도': { max: 70, min: 55, unit: '%', icon: 'droplet' },
        'CO2': { max: 600, min: 400, unit: 'ppm', icon: 'cloudy' },
        '조도': { max: 450, min: 250, unit: 'lux', icon: 'sun' }
    };

    // 버섯별 효능 정보 (데모 데이터) - mushroom_reference에 효능 컬럼이 없어서 당장은 유지
    var MUSHROOM_INFO = {
        '양송이버섯': ['항산화 성분이 풍부해 노화 방지에 도움', '비타민 D 함량이 높아 뼈 건강에 좋음', '저칼로리라 체중 관리에 부담이 적음'],
        '느타리버섯': ['베타글루칸이 풍부해 면역력 강화에 도움', '콜레스테롤 수치 관리에 도움', '식이섬유가 풍부해 장 건강에 좋음'],
        '표고버섯': ['렌티난 성분이 면역력 증진에 도움', '혈중 콜레스테롤 개선 효과', '비타민 B군이 풍부해 피로 회복에 도움'],
        '새송이버섯': ['식이섬유가 풍부해 소화와 배변 활동에 도움', '저칼로리·고단백이라 다이어트에 좋음', '칼륨이 풍부해 나트륨 배출에 도움'],
        '큰느타리': ['식이섬유가 풍부해 소화와 배변 활동에 도움', '저칼로리·고단백이라 다이어트에 좋음', '칼륨이 풍부해 나트륨 배출에 도움'],
        '팽이버섯': ['저칼로리·고식이섬유로 체중 관리에 도움', '아미노산이 풍부해 성장기 영양 보충에 좋음', '항산화 성분이 함유되어 있음']
    };

    function loadMushrooms() {
        return fetch('/cultivations/mushroom-references')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                MUSHROOMS = data.mushroomReferenceInfoResponses || [];
                renderMushroomSelect();
            })
            .catch(function () {
                alert('버섯 목록을 불러오지 못했습니다.');
            });
    }

    function renderMushroomSelect() {
        var select = document.getElementById('f-mushroom');
        select.innerHTML = '';
        if (MUSHROOMS.length === 0) {
            select.innerHTML = '<option value="">등록된 버섯이 없습니다</option>';
            return;
        }
        MUSHROOMS.forEach(function (m) {
            var opt = document.createElement('option');
            opt.value = m.id;
            opt.textContent = m.mushroomNameKo;
            select.appendChild(opt);
        });
    }

    function currentMushroom() {
        var id = document.getElementById('f-mushroom').value;
        return MUSHROOMS.filter(function (m) { return String(m.id) === String(id); })[0] || null;
    }

    function mushroomThresholdOf(mushroom, backendType) {
        if (!mushroom) return null;
        var t = (mushroom.thresholdInfoResponses || []).filter(function (x) {
            return x.sensorType && x.sensorType.type === backendType;
        })[0];
        return t ? { min: t.thresholdMin, max: t.thresholdMax } : null;
    }

    function renderMushroomInfo() {
        var selected = document.getElementById('f-mushroom');
        var mushroomName = selected.selectedOptions[0] ? selected.selectedOptions[0].textContent : '';
        document.getElementById('mushroom-info-name').textContent = mushroomName;

        var list = document.getElementById('mushroom-info-list');
        list.innerHTML = '';
        var benefits = MUSHROOM_INFO[mushroomName] || ['등록된 효능 정보가 아직 없어요.'];
        benefits.forEach(function (text) {
            var li = document.createElement('li');
            li.textContent = text;
            list.appendChild(li);
        });
    }

    function renderSensorSelectList() {
        var wrap = document.getElementById('sensor-select-list');
        wrap.innerHTML = '';
        REGISTERED_SENSORS.forEach(function (s) {
            var row = document.createElement('label');
            row.className = 'sensor-select-row';
            row.innerHTML =
                '<input type="checkbox" onchange="toggleSensor(' + s.id + ', this.checked)" />' +
                '<i data-lucide="' + s.icon + '" class="sensor-select-icon"></i>' +
                '<span class="sensor-select-info"><strong>' + s.type + ' 센서</strong><small>' + s.place + ' · ' + s.model + '</small></span>';
            wrap.appendChild(row);
        });
        lucide.createIcons();
    }

    function toggleSensor(id, checked) {
        if (checked) {
            if (selectedSensorIds.indexOf(id) === -1) selectedSensorIds.push(id);
        } else {
            selectedSensorIds = selectedSensorIds.filter(function (x) { return x !== id; });
        }
    }

    loadMushrooms();
    renderSensorSelectList();

    // 선택된 센서 하나하나마다 카드를 따로 만들어줌 (같은 타입이어도 센서별로 독립 설정)
    function renderRecommendGrid() {
        var grid = document.getElementById('recommend-grid');
        grid.innerHTML = '';

        var selectedSensors = REGISTERED_SENSORS.filter(function (s) {
            return selectedSensorIds.indexOf(s.id) !== -1;
        });

        if (selectedSensors.length === 0) {
            grid.innerHTML = '<p class="recommend-empty">선택된 센서가 없어요. 이전 단계에서 센서를 선택해주세요.</p>';
            return;
        }

        var mushroom = currentMushroom();

        // 같은 타입 센서가 여러 개면 카드 제목에 순번을 붙여 구분함
        var typeCount = {};
        selectedSensors.forEach(function (s) { typeCount[s.type] = (typeCount[s.type] || 0) + 1; });
        var typeSeen = {};

        selectedSensors.forEach(function (s) {
            var fallback = SENSOR_TYPE_FALLBACK[s.type] || { max: 0, min: 0, unit: '', icon: 'cpu' };
            var backendType = KOREAN_TO_SENSOR_TYPE[s.type];
            var registered = mushroom ? mushroomThresholdOf(mushroom, backendType) : null;
            var defaults = registered
                ? { max: registered.max, min: registered.min, unit: fallback.unit, icon: fallback.icon }
                : fallback;

            typeSeen[s.type] = (typeSeen[s.type] || 0) + 1;
            var title = s.type + ' 센서' + (typeCount[s.type] > 1 ? ' ' + typeSeen[s.type] : '');

            var card = document.createElement('div');
            card.className = 'recommend-card';
            card.innerHTML =
                '<div class="recommend-title"><i data-lucide="' + defaults.icon + '"></i>' + title + '</div>' +
                '<div class="recommend-subtitle">' + s.place + ' · ' + s.model + '</div>' +
                '<div class="recommend-inputs">' +
                '<label>최고값<input type="number" id="rec-max-' + s.id + '" value="' + defaults.max + '" />' + defaults.unit + '</label>' +
                '<label>최저값<input type="number" id="rec-min-' + s.id + '" value="' + defaults.min + '" />' + defaults.unit + '</label>' +
                '</div>';
            grid.appendChild(card);
        });

        lucide.createIcons();
    }

    function goToStep(n) {
        document.querySelectorAll('.wizard-panel').forEach(function (p) { p.classList.remove('active'); });
        document.querySelectorAll('.wizard-step').forEach(function (s) { s.classList.remove('active'); });
        document.getElementById('step-' + n).classList.add('active');
        document.getElementById('stepnav-' + n).classList.add('active');
        for (var i = 1; i < n; i++) {
            document.getElementById('stepnav-' + i).classList.add('done');
        }

        if (n === 3) {
            var selected = document.getElementById('f-mushroom');
            var mushroomName = selected.selectedOptions[0] ? selected.selectedOptions[0].textContent : '';
            document.getElementById('loading-mushroom').textContent = mushroomName;
            document.getElementById('result-mushroom').textContent = mushroomName;
            window.setTimeout(function () {
                renderMushroomInfo();
                renderRecommendGrid();
                goToStep(4);
            }, 2200);
        }
    }

    function finishCultivation() {
        var name = document.getElementById('f-name').value.trim();
        var mushroomId = document.getElementById('f-mushroom').value;

        if (!name) {
            alert('재배지 이름을 입력해주세요.');
            return;
        }
        if (!mushroomId) {
            alert('버섯 종류를 확인해주세요.');
            return;
        }

        fetch('/cultivations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'name=' + encodeURIComponent(name) + '&mushroomId=' + mushroomId
        }).then(function (res) {
            if (res.ok) {
                window.location.href = '/cultivations';
            } else {
                alert('재배지 생성에 실패했습니다.');
            }
        });
    }
</script>

</body>
</html>
