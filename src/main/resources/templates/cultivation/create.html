<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재배지 생성 | MushMush</title>
    <link rel="stylesheet" th:href="@{/css/cultivation-create.css}" />
    <script th:src="@{/js/lucide.js}"></script>
    <script th:src="@{/js/common.js}"></script>
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="wizard-page">
    <div class="wizard-box">

        <div class="wizard-steps">
            <div class="wizard-step active" id="stepnav-1">
                <span class="step-num">1</span>
                <span class="step-label">재배지 정보</span>
            </div>
            <span class="step-line"></span>
            <div class="wizard-step" id="stepnav-2">
                <span class="step-num">2</span>
                <span class="step-label">AI 분석</span>
            </div>
            <span class="step-line"></span>
            <div class="wizard-step" id="stepnav-3">
                <span class="step-num">3</span>
                <span class="step-label">확인</span>
            </div>
        </div>

        <div class="wizard-panels">

            <!-- STEP 1 : 재배지 정보 입력 -->
            <section class="wizard-panel active" id="step-1">
                <h2 class="wizard-title">재배지 정보를 입력해주세요</h2>
                <p class="wizard-desc">새로 시작할 재배지의 기본 정보를 알려주세요. 센서는 생성 후 '내 센서'에서 등록할 수 있어요.</p>

                <div class="form-grid">
                    <div class="form-field">
                        <label>재배지 이름</label>
                        <input type="text" id="f-name" placeholder="예: 양송이 1번 재배지" />
                    </div>
                    <div class="form-field">
                        <label>버섯 종류</label>
                        <select id="f-mushroom"></select>
                    </div>
                </div>

                <div class="wizard-actions">
                    <button class="step-next" type="button" onclick="goToStep(2)" title="다음">
                        <i data-lucide="circle-arrow-right"></i>
                    </button>
                </div>
            </section>

            <!-- STEP 2 : 로딩 (AI 분석) -->
            <section class="wizard-panel" id="step-2">
                <div class="loading-wrap">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">AI가 <span id="loading-mushroom">양송이버섯</span> 재배 정보를<br />준비하고 있어요...</p>
                </div>
            </section>

            <!-- STEP 3 : 버섯 효능 확인 -->
            <section class="wizard-panel" id="step-3">
                <h2 class="wizard-title">
                    <span id="result-mushroom">양송이버섯</span> 재배를 시작해볼까요?
                </h2>
                <p class="wizard-desc">센서와 환경 임계값은 생성 후 '내 센서'에서 등록할 수 있어요.</p>

                <div class="mushroom-info-card" id="mushroom-info-card">
                    <div class="mushroom-info-title">
                        <i data-lucide="sparkles"></i><span id="mushroom-info-name">양송이버섯</span> AI 재배 가이드
                    </div>

                    <div class="mushroom-badges" id="mushroom-badges"></div>

                    <p class="mushroom-info-summary" id="mushroom-info-summary"></p>

                    <div class="mushroom-info-note mushroom-info-caution" id="mushroom-info-caution-wrap">
                        <i data-lucide="alert-triangle"></i>
                        <span id="mushroom-info-caution"></span>
                    </div>

                    <div class="mushroom-info-note mushroom-info-tip" id="mushroom-info-tip-wrap">
                        <i data-lucide="lightbulb"></i>
                        <span id="mushroom-info-tip"></span>
                    </div>

                    <div class="mushroom-env-grid" id="mushroom-env-grid"></div>

                    <button type="button" class="mushroom-recipe-btn" id="mushroom-recipe-btn" onclick="openRecipeModal()">
                        <i data-lucide="chef-hat"></i>추천 요리법 보기
                    </button>
                </div>

                <div class="recipe-modal-overlay" id="recipe-modal-overlay" onclick="closeRecipeModal(event)">
                    <div class="recipe-modal">
                        <div class="recipe-modal-header">
                            <div class="mushroom-info-subtitle"><i data-lucide="chef-hat"></i>추천 요리법</div>
                            <button type="button" class="recipe-modal-close" onclick="closeRecipeModal()">
                                <i data-lucide="x"></i>
                            </button>
                        </div>
                        <div class="mushroom-recipe-list" id="mushroom-recipe-list"></div>
                    </div>
                </div>

                <div class="wizard-actions wizard-actions-split">
                    <button class="step-next" type="button" onclick="goToStep(1)" title="이전">
                        <i data-lucide="circle-arrow-left"></i>
                    </button>
                    <button class="btn btn-primary" type="button" onclick="finishCultivation()">
                        <i data-lucide="check"></i>재배 시작하기
                    </button>
                </div>
            </section>

        </div>
    </div>
</div>

<script th:inline="javascript">
    var mushroomsData = [(${mushroomsJson})];
</script>
<!-- SSR bootstrap 계약이 바뀐 JS를 이전 브라우저 캐시와 섞지 않습니다. -->
<script th:src="@{/js/cultivation-create.js(v=${'ssr-create-v2'})}"></script>

</body>
</html>
