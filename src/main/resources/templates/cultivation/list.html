<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 재배지 | MushMush</title>
    <link rel="stylesheet" th:href="@{/css/cultivation-list.css}" />
    <script th:src="@{/js/lucide.js}"></script>
    <script th:src="@{/js/common.js}"></script>
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="page-container">

    <nav class="tabs-nav">
        <button class="tab-btn active" type="button" onclick="switchTab('cultivation')">
            <i data-lucide="layout-grid"></i>내 재배지
        </button>
        <button class="tab-btn" type="button" onclick="switchTab('sensor')">
            <i data-lucide="cpu"></i>내 센서
        </button>
    </nav>

    <div class="list-panels">

        <!-- 내 재배지 목록 -->
        <section id="tab-cultivation" class="list-panel active">
            <div class="list-table-wrap">
                <table class="list-table">
                    <thead>
                    <tr>
                        <th>Cultivation 이름</th>
                        <th>버섯 종류</th>
                        <th>인원</th>
                        <th>관리자</th>
                        <th>생성일</th>
                    </tr>
                    </thead>
                    <tbody id="cultivation-tbody"></tbody>
                </table>
            </div>

            <div class="list-footer">
                <div class="pagination" id="cultivation-pagination">
                    <button class="page-arrow" type="button" onclick="changePage('cultivation', -1)">
                        <i data-lucide="chevron-left"></i>
                    </button>
                    <div class="page-dots" id="cultivation-dots"></div>
                    <button class="page-arrow" type="button" onclick="changePage('cultivation', 1)">
                        <i data-lucide="chevron-right"></i>
                    </button>
                </div>
                <button class="btn btn-primary" type="button" onclick="location.href='/cultivations/new'">
                    <i data-lucide="plus"></i>새 재배지 생성
                </button>
            </div>
        </section>

        <!-- 내 센서 목록 -->
        <section id="tab-sensor" class="list-panel">
            <div class="list-table-wrap">
                <table class="list-table">
                    <thead>
                    <tr>
                        <th>재배지</th>
                        <th>위치</th>
                        <th>상세 위치</th>
                        <th>모델명</th>
                        <th>고유번호</th>
                        <th>타입</th>
                        <th>상태</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="sensor-tbody"></tbody>
                </table>
            </div>

            <div class="list-footer">
                <div class="pagination" id="sensor-pagination">
                    <button class="page-arrow" type="button" onclick="changePage('sensor', -1)">
                        <i data-lucide="chevron-left"></i>
                    </button>
                    <div class="page-dots" id="sensor-dots"></div>
                    <button class="page-arrow" type="button" onclick="changePage('sensor', 1)">
                        <i data-lucide="chevron-right"></i>
                    </button>
                </div>
                <button class="btn btn-primary" type="button" onclick="openSensorModal()">
                    <i data-lucide="plus"></i>센서 등록
                </button>
            </div>
        </section>

    </div>
</div>

<!-- 센서 등록 다이얼로그 -->
<div class="modal-overlay" id="modal-sensor">
    <div class="modal-box modal-box-wide">
        <button class="modal-close" type="button" onclick="closeModal('modal-sensor')">
            <i data-lucide="x"></i>
        </button>
        <h3 class="modal-title">센서 등록</h3>

        <div class="modal-field">
            <label>재배지</label>
            <div class="msh-select" id="ms-cultivation" data-value="">
                <button type="button" class="msh-select-trigger" onclick="toggleMshSelect(this.parentElement)">
                    <span class="msh-select-value">재배지를 선택하세요</span>
                    <i data-lucide="chevron-down" class="msh-select-chevron"></i>
                </button>
                <div class="msh-select-menu" id="ms-cultivation-menu"></div>
            </div>
        </div>

        <div class="modal-field-row">
            <div class="modal-field">
                <label>센서 이름</label>
                <input type="text" id="ms-name" placeholder="예: 1번 선반 온습도센서" />
            </div>
            <div class="modal-field">
                <label>모델명</label>
                <input type="text" id="ms-model" placeholder="모델명을 입력하세요" />
            </div>
        </div>

        <div class="modal-field-row">
            <div class="modal-field">
                <label>위치 (최대 10자)</label>
                <input type="text" id="ms-location" maxlength="10" placeholder="예: 광주광역시" />
            </div>
            <div class="modal-field">
                <label>상세 위치</label>
                <input type="text" id="ms-location-detail" placeholder="예: 1번 선반" />
            </div>
        </div>

        <div class="modal-field">
            <label>고유번호</label>
            <input type="text" id="ms-serial" placeholder="예: 1000090909090" />
        </div>

        <div class="modal-field">
            <label>측정 타입 선택 및 임계값 설정</label>
            <div class="sensor-type-add-row" style="display:flex; gap:8px; margin-bottom:8px;">
                <select id="ms-type-select" style="flex:1; padding:8px 12px; border:2px solid var(--brown-300); border-radius:8px; font-family:inherit; background:#fff;">
                    <option value="">추가할 측정 타입을 선택하세요</option>
                </select>
                <button type="button" class="btn btn-outline" style="padding:6px 14px; white-space:nowrap;" onclick="addSensorTypeRow()">+ 추가</button>
            </div>
            <div class="sensor-type-check-list" id="ms-type-list"></div>
        </div>

        <div class="modal-actions">
            <button class="btn btn-outline" type="button" onclick="closeModal('modal-sensor')">Cancel</button>
            <button class="btn btn-primary" type="button" onclick="registerSensor()">등록</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    var cultivationListPageData = [(${cultivationListPageJson})];
    var mushroomRefsData = /*[(${mushroomsJson})]*/ [];
</script>
<!-- SSR bootstrap 계약이 바뀐 JS를 이전 브라우저 캐시와 섞지 않습니다. -->
<script th:src="@{/js/cultivation-list.js(v=${'ssr-list-v2'})}"></script>
<script th:src="@{/js/msh-select.js}"></script>

</body>
</html>
