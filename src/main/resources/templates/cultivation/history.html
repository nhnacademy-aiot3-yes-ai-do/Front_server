<!-- templates/cultivation/history.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재배 이력 | MushMush</title>
    <link rel="stylesheet" th:href="@{/css/cultivation-history.css}" />
    <script th:src="@{/js/lucide.js}"></script>
    <script th:src="@{/js/common.js}"></script>
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="page-container">

    <div class="history-box">

        <aside class="history-sidebar">
            <div class="history-name-list" id="history-name-list"></div>
        </aside>

        <div class="history-detail" id="history-detail">
            <!-- JS로 채워짐 -->
        </div>

    </div>

</div>

<!-- 재배 이력 비교 다이얼로그 -->
<div class="modal-overlay" id="modal-compare">
    <div class="modal-box modal-box-wide">
        <button class="modal-close" type="button" onclick="closeModal('modal-compare')">
            <i data-lucide="x"></i>
        </button>
        <h3 class="modal-title">재배 이력 비교</h3>
        <p class="modal-desc">비교할 다른 재배를 선택해보세요.</p>
        <div class="modal-field">
            <label>비교 대상</label>
            <select id="compare-target-select" onchange="renderCompareRows()"></select>
        </div>
        <div class="compare-rows" id="compare-rows"></div>
    </div>
</div>

<script th:inline="javascript">
    var pageData = [(${historyJson})];
    var mushroomRefs = /*[(${mushroomsJson})]*/ [];

    // mushroomId -> 한글 품종명 매핑 ("버섯 #1" 대신 "느타리버섯" 등으로 보여주기 위함)
    var MUSHROOM_NAME_MAP = {};
    mushroomRefs.forEach(function (m) {
        MUSHROOM_NAME_MAP[m.id] = m.mushroomNameKo;
    });

    var CULTIVATION_HISTORY = pageData.content.map(function (c) {
        return {
            id: c.cultivationId,
            name: c.name,
            mushroomId: c.mushroomId,
            mushroomName: c.mushroomId != null ? MUSHROOM_NAME_MAP[c.mushroomId] : null,
            amount: c.harvestWeight,
            grade: c.productGrade,
            finishedAt: c.finishedAt
        };
    });
</script>
<script th:src="@{/js/cultivation-history.js}"></script>

</body>
</html>
