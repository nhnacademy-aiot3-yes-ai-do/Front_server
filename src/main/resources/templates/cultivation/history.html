<!-- templates/cultivation/history.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재배 이력 | MushMush</title>
    <link rel="stylesheet" href="/css/cultivation-history.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <div class="topbar-left">
            <a href="/" class="topbar-logo-link">
                <img src="/images/logo2.png" alt="MushMush 로고" class="topbar-logo" />
            </a>
        </div>
        <div class="topbar-right">
            <button class="topbar-link" type="button" onclick="location.href='/mypage'">
                <i data-lucide="user"></i>내 정보 보기
            </button>
            <button class="topbar-link" type="button" onclick="location.href='/cultivations/history'">
                <i data-lucide="history"></i>재배 이력
            </button>
            <button class="topbar-link topbar-link-danger" type="button" onclick="logout()">
                <i data-lucide="log-out"></i>로그아웃
            </button>
            <span class="topbar-divider"></span>
            <div class="avatar-circle"><i data-lucide="circle-user-round"></i></div>
            <span class="topbar-nickname">오인택</span>
        </div>
    </div>
</header>

<div class="page-container">

    <div class="history-heading">
        <i data-lucide="history" style="width:20px;height:20px;"></i>
        <span>재배 이력</span>
    </div>

    <div class="history-box">

        <aside class="history-sidebar">
            <div class="history-name-list" id="history-name-list"></div>
        </aside>

        <div class="history-detail" id="history-detail">
            <!-- JS로 채워짐 -->
        </div>

    </div>

</div>

<!-- 재배 이력 비교 다이얼로그 -->
<div class="modal-overlay" id="modal-compare">
    <div class="modal-box modal-box-wide">
        <button class="modal-close" type="button" onclick="closeModal('modal-compare')">
            <i data-lucide="x"></i>
        </button>
        <h3 class="modal-title">재배 이력 비교</h3>
        <p class="modal-desc">비교할 다른 재배를 선택해보세요.</p>
        <div class="modal-field">
            <label>비교 대상</label>
            <select id="compare-target-select" onchange="renderCompareRows()"></select>
        </div>
        <div class="compare-rows" id="compare-rows"></div>
    </div>
</div>

<script th:inline="javascript">
    function logout() {
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '/logout';
        document.body.appendChild(form);
        form.submit();
    }

    var historyState = { selectedId: null };

    var pageData = /*[[${history}]]*/ { content: [] };
    var CULTIVATION_HISTORY = pageData.content.map(function (c) {
        return {
            id: c.cultivationId,
            name: c.name,
            mushroomId: c.mushroomId,
            amount: c.harvestWeight,
            grade: c.productGrade,
            finishedAt: c.finishedAt
        };
    });

    function findCultivation(id) {
        return CULTIVATION_HISTORY.filter(function (c) { return c.id === id; })[0];
    }

    function buildHistorySummary(c) {
        var seed = hashSeed(c.name);
        var avgTemp = 17 + (seed % 6);
        var avgHumidity = 52 + ((seed >> 3) % 18);
        var pestDays = (seed >> 12) % 3;

        var summary =
            '총 ' + c.days + '일 동안 재배해서 ' + c.count + '회에 걸쳐 총 ' + c.amount + 'g을 수확했어요. ' +
            '평균 온도 ' + avgTemp + '°C, 평균 습도 ' + avgHumidity + '%를 유지했고, ' +
            (pestDays === 0 ? '병충해 없이 잘 마무리된 재배였습니다.' : '병충해 징후가 ' + pestDays + '일 감지되었어요.');

        return { avgTemp: avgTemp, avgHumidity: avgHumidity, pestDays: pestDays, summary: summary };
    }

    function selectHistoryItem(id) {
        historyState.selectedId = id;
        renderHistorySidebar();
        renderHistoryDetail(id);
    }

    function renderHistorySidebar() {
        var listWrap = document.getElementById('history-name-list');

        if (CULTIVATION_HISTORY.length === 0) {
            listWrap.innerHTML = '<div class="history-empty">아직 종료된 재배 이력이 없습니다.</div>';
            return;
        }

        listWrap.innerHTML = '';
        CULTIVATION_HISTORY.forEach(function (c) {
            var item = document.createElement('div');
            item.className = 'history-name-item' + (c.id === historyState.selectedId ? ' active' : '');
            item.textContent = c.name;
            item.onclick = function () { selectHistoryItem(c.id); };
            listWrap.appendChild(item);
        });
    }

    function renderHistoryDetail(id) {
        var c = findCultivation(id);
        var detail = document.getElementById('history-detail');

        if (!c) {
            detail.innerHTML = '<div class="history-empty">재배를 선택해주세요.</div>';
            return;
        }

        var info = buildHistorySummary(c);
        detail.innerHTML =
            '<div class="history-detail-header">' +
            '<div>' +
            '<div class="history-detail-title">' + c.name + ' · ' + c.type + '</div>' +
            '<div class="history-detail-period">' + c.period + '</div>' +
            '</div>' +
            '<span class="history-badge">종료됨</span>' +
            '</div>' +
            '<div class="env-stat-grid">' +
            '<div class="env-stat-item"><i data-lucide="calendar-days" class="env-stat-icon"></i><span class="env-stat-label">총 재배기간</span><span class="env-stat-value">' + c.days + '일</span></div>' +
            '<div class="env-stat-item"><i data-lucide="package" class="env-stat-icon"></i><span class="env-stat-label">총 재배량</span><span class="env-stat-value">' + c.amount + 'g</span></div>' +
            '<div class="env-stat-item"><i data-lucide="hash" class="env-stat-icon"></i><span class="env-stat-label">총 수확 횟수</span><span class="env-stat-value">' + c.count + '회</span></div>' +
            '<div class="env-stat-item"><i data-lucide="shield-alert" class="env-stat-icon"></i><span class="env-stat-label">병충해 감지일</span><span class="env-stat-value">' + info.pestDays + '일</span></div>' +
            '</div>' +
            '<p class="history-summary">' +
            '<i data-lucide="sparkles" style="width:14px;height:14px;vertical-align:-2px;margin-right:4px;color:var(--sage-600);"></i>' +
            info.summary + '</p>' +
            '<button class="btn btn-primary history-compare-btn" type="button" onclick="openCompareModal()">비교하기</button>';

        lucide.createIcons();
    }

    function openModal(id) {
        document.getElementById(id).classList.add('is-open');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('is-open');
    }

    function openCompareModal() {
        var select = document.getElementById('compare-target-select');
        select.innerHTML = CULTIVATION_HISTORY
            .filter(function (c) { return c.id !== historyState.selectedId; })
            .map(function (c) { return '<option value="' + c.id + '">' + c.name + ' · ' + c.type + ' (' + c.period + ')</option>'; })
            .join('');

        renderCompareRows();
        openModal('modal-compare');
    }

    function buildCompareRow(label, currentValue, targetValue, unit) {
        var diff = currentValue - targetValue;
        var diffClass = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
        var diffText = diff === 0 ? '선택한 재배와 동일' :
            (diff > 0 ? '▲ +' + diff + unit + ' 더 많음' : '▼ ' + diff + unit + ' 더 적음');

        return '<div class="compare-row">' +
            '<span class="compare-label">' + label + '</span>' +
            '<span class="compare-current">' + currentValue + unit + '</span>' +
            '<span class="compare-avg">비교 대상 ' + targetValue + unit + '</span>' +
            '<span class="compare-diff ' + diffClass + '">' + diffText + '</span>' +
            '</div>';
    }

    function renderCompareRows() {
        var current = findCultivation(historyState.selectedId);
        var targetId = Number(document.getElementById('compare-target-select').value);
        var target = findCultivation(targetId);

        if (!current || !target) {
            document.getElementById('compare-rows').innerHTML = '';
            return;
        }

        document.getElementById('compare-rows').innerHTML =
            buildCompareRow('총 재배량', current.amount, target.amount, 'g') +
            buildCompareRow('재배 기간', current.days, target.days, '일') +
            buildCompareRow('수확 횟수', current.count, target.count, '회');
    }

    lucide.createIcons();
    historyState.selectedId = CULTIVATION_HISTORY.length > 0 ? CULTIVATION_HISTORY[0].id : null;
    renderHistorySidebar();
    renderHistoryDetail(historyState.selectedId);
</script>

</body>
</html>
