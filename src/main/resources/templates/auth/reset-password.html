<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>새 비밀번호 설정 | MushMush</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <img src="/images/logo1.png" alt="MushMush 로고" class="auth-logo" />

        <div class="auth-body">
            <p class="auth-subtitle">새로 사용하실 비밀번호를 입력해 주세요.</p>

            <form action="/reset-password" method="post">
                <input type="hidden" name="email" th:value="${email}" />

                <div class="field">
                    <input type="password" id="new-password" name="newPassword" placeholder="새 비밀번호" required />
                </div>

                <div class="field">
                    <input type="password" id="confirm-password" name="confirmPassword" placeholder="비밀번호 재입력" required />
                </div>
                <p class="help-text ok">비밀번호가 일치합니다.</p>
                <p class="help-text error" th:if="${resetPasswordError}" th:text="${resetPasswordError}"></p>

                <button type="submit" class="btn btn-primary">완료</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
