<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 | MushMush</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <img src="/images/logo1.png" alt="MushMush 로고" class="auth-logo" />

        <div class="auth-body">
            <p class="auth-subtitle">사용하실 이메일과 비밀번호를 입력해 주세요.</p>

            <form action="/signup-nickname" method="get" onsubmit="return handleSubmit(event)">
                <div class="field">
                    <div class="field-inline">
                        <input type="email" id="email" name="email" placeholder="you@example.com" required oninput="handleEmailChanged()" />
                        <button type="button" class="btn btn-outline btn-inline" onclick="handleCheckEmail()">중복확인</button>
                    </div>
                </div>

                <div class="field" id="verify-code-field" style="display:none; margin-bottom: 8px;">
                    <div class="field-inline" style="position: relative;">
                        <input type="text" id="verify-code" placeholder="인증번호 6자리" maxlength="6" style="padding-right: 55px;" />

                        <span id="timer-text" style="position: absolute; right: 105px; top: 50%; transform: translateY(-50%); color: #ef4444; font-weight: bold; font-size: 13px; pointer-events: none;"></span>

                        <button type="button" id="btn-verify-code" class="btn btn-outline btn-inline" onclick="handleVerifyCode()">인증확인</button>
                    </div>
                    <p class="help-text" id="verify-status-text" style="font-size: 12px; color: #64748b; margin-top: 4px; margin-bottom: 0;"></p>
                </div>

                <div class="field">
                    <input type="password" id="password" name="password" placeholder="비밀번호" required />
                    <p class="help-text" style="font-size: 12px; color: #64748b; margin-top: 4px;">
                        ※ 비밀번호는 영문, 숫자, 특수문자(@$!%*#?&) 포함 8자 이상
                    </p>
                </div>

                <button type="submit" class="btn btn-primary">다음</button>
            </form>

            <div class="auth-links">
                <span>이미 계정이 있으신가요?</span>
                <a href="/login">로그인</a>
            </div>
        </div>
    </div>
</div>


<script>
    let emailChecked = false;   // 중복확인 통과 여부
    let emailVerified = false;  // 인증번호 확인 통과 여부
    let isTimerExpired = false; // 타이머 만료 여부
    let timerInterval = null; // 타이머 객체 변수

    function startTimer(durationSeconds){
        if(timerInterval){
            clearInterval(timerInterval);
        }

        isTimerExpired = false;
        document.getElementById("verify-code").disabled = false;
        const verifyBtn = document.getElementById("btn-verify-code");
        if (verifyBtn) verifyBtn.disabled = false;

        let timeLeft = durationSeconds;
        const timerText = document.getElementById("timer-text");

        timerInterval = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerText.textContent = `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                isTimerExpired = true;
                timerText.textContent = "(만료됨)";
                document.getElementById("verify-code").disabled = true;
                if (verifyBtn) verifyBtn.disabled = true;
                const statusText = document.getElementById("verify-status-text");
                statusText.textContent = "인증 시간이 만료되었어요. 다시 재발송 받아주세요.";
                statusText.style.color = "#dc2626";
            }
            timeLeft--;
        }, 1000);
    }

    function handleEmailChanged() {
        emailChecked = false;
        emailVerified = false;
        isTimerExpired = false;
        document.getElementById("verify-code-field").style.display = "none";
        document.getElementById("verify-code").value = "";
        document.getElementById("verify-code").disabled = false;
        const verifyBtn = document.getElementById("btn-verify-code");
        if (verifyBtn) verifyBtn.disabled = false;
    }

    async function handleCheckEmail() {
        const email = document.getElementById("email").value.trim();

        if (!email) {
            alert("이메일을 입력해 주세요.");
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            alert("올바른 이메일 형식이 아닙니다.");
            return;
        }

        try {
            const response = await fetch(`/users/check-email?email=${encodeURIComponent(email)}`);
            const isDuplicated = await response.json();
            if (isDuplicated) {
                alert("이미 사용 중인 이메일입니다!");
                emailChecked = false;
                return;
            }

            emailChecked = true;

            const sendResponse = await fetch(`/users/email/send?email=${encodeURIComponent(email)}`, { method: "POST" });
            if (!sendResponse.ok) {
                const errData = await sendResponse.json();
                alert(errData.message || "인증번호 발송에 실패했습니다.");
                return;
            }

            emailVerified = false;
            document.getElementById("verify-code-field").style.display = "block";
            alert("사용 가능한 이메일입니다! 인증번호를 발송했어요.");
            startTimer(300);

         } catch (error) {
            console.error(error);
            alert("요청 중 오류가 발생했습니다. 다시 시도해 주세요.");
        }
    }

    async function handleVerifyCode() {
        const email = document.getElementById("email").value;
        const code = document.getElementById("verify-code").value;
        const statusText = document.getElementById("verify-status-text");

        if (isTimerExpired) {
            statusText.textContent = "인증 시간이 만료되었어요. 다시 재발송 받아주세요.";
            statusText.style.color = "#dc2626";
            return;
        }

        if (!code) {
            alert("인증번호를 입력해 주세요.");
            return;
        }

        if (!/^\d{6}$/.test(code.trim())) {
            statusText.textContent = "인증번호는 숫자 6자리입니다.";
            statusText.style.color = "#dc2626";
            return;
        }

        try {
            const response = await fetch(
                `/users/email/verify?email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`,
                { method: "POST" }
            );

            if (!response.ok) {
                const errData = await response.json();
                statusText.textContent = errData.message || "인증번호는 총 6자리 입니다.";
                statusText.style.color = "#dc2626";
                return;
            }

            const isVerified = await response.json();

            if (isVerified === true) {
                clearInterval(timerInterval);
                document.getElementById("timer-text").textContent = "";
                emailVerified = true;
                statusText.textContent = "인증되었습니다.";
                statusText.style.color = "#16a34a";
                document.getElementById("verify-code").disabled = true;
            } else {
                emailVerified = false;
                statusText.textContent = "인증번호가 올바르지 않아요. 다시 확인해 주세요.";
                statusText.style.color = "#dc2626";
            }
        } catch (error) {
            console.error(error);
            statusText.textContent = "인증 검증 중 에러가 발생했습니다.";
            statusText.style.color = "#dc2626";
        }
    }

    function handleSubmit(event) {
        if (!emailChecked) {
            event.preventDefault();
            alert("이메일 중복확인을 먼저 진행해 주세요.");
            return false;
        }
        if (!emailVerified) {
            event.preventDefault();
            alert("이메일 인증을 완료해 주세요.");
            return false;
        }
        return true;
    }
</script>

</body>
</html>
