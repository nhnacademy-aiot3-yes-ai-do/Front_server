<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | MushMush</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/lucide.js"></script>
    <script src="/js/common.js"></script>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <img src="/images/logo1.png" alt="MushMush 로고" class="auth-logo" />

        <div class="auth-body">
            <p class="help-text error" id="login-error-text" th:if="${loginError}" th:text="${loginError}"></p>

            <form id="login-form" action="/login" method="post">
                <div class="field">
                    <input type="email" id="email" name="email" placeholder="이메일" required />
                </div>

                <div class="field">
                    <input type="password" id="password" name="password" placeholder="비밀번호" required />
                </div>

                <button type="submit" class="btn btn-primary">로그인</button>
            </form>

            <div class="divider">또는</div>

            <button type="button" class="btn btn-secondary">OAuth 로그인</button>

            <div class="auth-links">
                <a href="/signup">회원가입</a>
                <span>|</span>
                <a href="/find-password">비밀번호 찾기</a>
            </div>
        </div>
    </div>
</div>

<!-- 휴면 계정 안내 + 인증 팝업 (프론트 목업: 실제 인증/복구 API 연동 없음) -->
<div class="modal-overlay" id="modal-dormant">
    <div class="modal-box">
        <button class="modal-close" type="button" onclick="closeDormantModal()">
            <i data-lucide="x"></i>
        </button>

        <!-- 1단계: 휴면 계정 안내 -->
        <div class="modal-step" id="dormant-step-notice">
            <h3 class="modal-title">휴면 계정 안내</h3>
            <p class="modal-desc">
                장기간 로그인하지 않아 휴면 계정으로 전환된 계정이에요.<br />
                이메일 인증을 완료하면 계정을 바로 복구할 수 있어요.
            </p>

            <div class="modal-field">
                <label>이메일</label>
                <input type="email" id="dormant-email" readonly />
            </div>

            <div class="modal-actions">
                <button class="btn btn-outline" type="button" onclick="closeDormantModal()">닫기</button>
                <button class="btn btn-primary" type="button" onclick="handleDormantSendCode()" id="dormant-send-btn">인증번호 받기</button>
            </div>
        </div>

        <!-- 2단계: 인증번호 입력 -->
        <div class="modal-step" id="dormant-step-code" style="display:none;">
            <h3 class="modal-title">인증번호 입력</h3>
            <p class="modal-desc">
                <span id="dormant-email-echo"></span>로 인증번호를 발송했어요.<br />
                받으신 인증번호 6자리를 입력해 주세요.
            </p>

            <div class="modal-field">
                <label>인증번호</label>
                <div class="field-inline">
                    <input type="text" id="dormant-code" maxlength="6" placeholder="인증번호 6자리" style="padding-right: 55px;" />
                    <span id="dormant-timer-text" style="position: absolute; right: 105px; top: 50%; transform: translateY(-50%); color: #ef4444; font-weight: bold; font-size: 13px; pointer-events: none;"></span>
                    <button type="button" id="dormant-verify-btn" class="btn btn-outline btn-inline" onclick="handleDormantVerifyCode()">인증확인</button>
                </div>
                <p class="help-text" id="dormant-status-text" style="min-height: 16px; margin-top: 4px; margin-bottom: 0;"></p>
            </div>

            <div class="modal-actions">
                <button class="btn btn-outline" type="button" onclick="showDormantStep('notice')">이전</button>
                <button class="btn btn-primary" type="button" onclick="handleDormantResend()">재발송</button>
            </div>
        </div>

        <!-- 3단계: 복구 완료 -->
        <div class="modal-step" id="dormant-step-success" style="display:none;">
            <div class="modal-success">
                <div class="modal-success-icon"><i data-lucide="check"></i></div>
                <h3 class="modal-title">계정이 복구되었어요!</h3>
                <p class="modal-desc">휴면 상태가 해제되었습니다.<br />잠시 후 자동으로 로그인돼요.</p>
            </div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    // ── 목업 상수 (백엔드 연동 전 프론트 UX 확인용) ──────────────────
    // 실제로는 로그인 실패 응답 문구(loginError)에 '휴면'이 포함되면 자동으로 팝업이 뜬다.
    // 백엔드가 아직 휴면 판별 문구를 내려주지 않으므로, 데모용으로 이 이메일로 로그인 시도하면
    // 서버 요청 없이 팝업을 바로 재현할 수 있게 해둠. (실 연동 시 이 블록만 제거하면 됨)
    var DEMO_DORMANT_EMAIL = 'dormant@yesaido.com';

    var dormantTimerInterval = null;
    var dormantTimerExpired = false;
    var dormantCurrentEmail = '';

    function showDormantStep(step) {
        document.getElementById('dormant-step-notice').style.display = step === 'notice' ? 'block' : 'none';
        document.getElementById('dormant-step-code').style.display = step === 'code' ? 'block' : 'none';
        document.getElementById('dormant-step-success').style.display = step === 'success' ? 'block' : 'none';
    }

    function openDormantModal(email) {
        dormantCurrentEmail = email || '';
        document.getElementById('dormant-email').value = dormantCurrentEmail;
        document.getElementById('dormant-email-echo').textContent = dormantCurrentEmail;
        document.getElementById('dormant-code').value = '';
        document.getElementById('dormant-status-text').textContent = '';
        document.getElementById('dormant-send-btn').disabled = false;
        document.getElementById('dormant-send-btn').textContent = '인증번호 받기';
        showDormantStep('notice');
        openModal('modal-dormant');
    }

    function closeDormantModal() {
        if (dormantTimerInterval) clearInterval(dormantTimerInterval);
        closeModal('modal-dormant');
    }

    function startDormantTimer(durationSeconds) {
        if (dormantTimerInterval) clearInterval(dormantTimerInterval);

        dormantTimerExpired = false;
        var codeInput = document.getElementById('dormant-code');
        var verifyBtn = document.getElementById('dormant-verify-btn');
        codeInput.disabled = false;
        verifyBtn.disabled = false;

        var timeLeft = durationSeconds;
        var timerText = document.getElementById('dormant-timer-text');

        dormantTimerInterval = setInterval(function () {
            var minutes = Math.floor(timeLeft / 60);
            var seconds = timeLeft % 60;
            timerText.textContent = minutes + ':' + (seconds < 10 ? '0' : '') + seconds;

            if (timeLeft <= 0) {
                clearInterval(dormantTimerInterval);
                dormantTimerExpired = true;
                timerText.textContent = '(만료됨)';
                codeInput.disabled = true;
                verifyBtn.disabled = true;
                var statusText = document.getElementById('dormant-status-text');
                statusText.textContent = '인증 시간이 만료되었어요. 재발송을 눌러주세요.';
                statusText.classList.add('error');
            }
            timeLeft--;
        }, 1000);
    }

    function handleDormantSendCode() {
        var btn = document.getElementById('dormant-send-btn');
        btn.disabled = true;
        btn.textContent = '발송 중...';

        // 목업: 실제 이메일 발송 없이 지연만 흉내냄
        setTimeout(function () {
            showDormantStep('code');
            document.getElementById('dormant-status-text').textContent = '';
            document.getElementById('dormant-status-text').classList.remove('error');
            startDormantTimer(300);
        }, 500);
    }

    function handleDormantResend() {
        document.getElementById('dormant-code').value = '';
        var statusText = document.getElementById('dormant-status-text');
        statusText.textContent = '인증번호를 다시 보냈어요.';
        statusText.classList.remove('error');
        startDormantTimer(300);
    }

    function handleDormantVerifyCode() {
        var code = document.getElementById('dormant-code').value.trim();
        var statusText = document.getElementById('dormant-status-text');

        if (dormantTimerExpired) {
            statusText.textContent = '인증 시간이 만료되었어요. 재발송을 눌러주세요.';
            statusText.classList.add('error');
            return;
        }

        if (!/^\d{6}$/.test(code)) {
            statusText.textContent = '인증번호는 숫자 6자리입니다.';
            statusText.classList.add('error');
            return;
        }

        // 목업: 백엔드 검증 없이 형식만 맞으면 인증 성공 처리
        clearInterval(dormantTimerInterval);
        document.getElementById('dormant-timer-text').textContent = '';
        document.getElementById('dormant-code').disabled = true;
        document.getElementById('dormant-verify-btn').disabled = true;
        statusText.classList.remove('error');
        statusText.textContent = '인증되었습니다. 계정을 복구하는 중이에요...';

        setTimeout(function () {
            showDormantStep('success');
            lucide.createIcons();
        }, 500);

        // 복구 완료 후 자동 로그인 흐름으로 이동 (목업: 홈으로 리다이렉트)
        setTimeout(function () {
            window.location.href = '/';
        }, 2000);
    }

    // ── 휴면 문구 자동 감지 ─────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
        var errorEl = document.getElementById('login-error-text');
        var savedEmail = sessionStorage.getItem('mm_login_email') || '';

        if (errorEl && errorEl.textContent && errorEl.textContent.indexOf('휴면') !== -1) {
            errorEl.style.display = 'none';
            openDormantModal(savedEmail);
        }

        sessionStorage.removeItem('mm_login_email');
    });

    // 로그인 폼 제출 시 이메일을 임시 저장해 팝업에서 표시할 수 있도록 함
    document.getElementById('login-form').addEventListener('submit', function (e) {
        var emailValue = document.getElementById('email').value.trim();
        sessionStorage.setItem('mm_login_email', emailValue);

        // 데모 트리거: 백엔드에 휴면 판별 로직이 붙기 전까지, 이 이메일로는
        // 서버 요청 없이 바로 휴면 팝업을 재현한다.
        if (emailValue === DEMO_DORMANT_EMAIL) {
            e.preventDefault();
            openDormantModal(emailValue);
        }
    });
</script>

</body>
</html>
