<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MushMush | 로그인 성공</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --success-color: #10b981;
            --dark-card: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .success-card {
            background: var(--dark-card);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrap {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .icon-wrap svg {
            width: 40px;
            height: 40px;
            stroke: #ffffff;
            stroke-width: 3;
        }

        h1 {
            color: #0f172a;
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 10px;
        }

        p.sub-text {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .token-badge {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            font-size: 13px;
            color: #475569;
            margin-bottom: 28px;
            text-align: left;
            word-break: break-all;
        }

        .token-badge label {
            font-weight: 600;
            color: #0f172a;
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(168, 85, 247, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 rgba(168, 85, 247, 0.5);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
    </style>
</head>
<body>

<div class="success-card">
    <div class="icon-wrap">
        <svg fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
    </div>

    <h1>로그인 성공! 🎉</h1>
    <p class="sub-text">MushMush 인증 서버로부터 정상적으로 JWT 토큰이 발급되었습니다.</p>

    <div class="token-badge">
        <label>🔑 발급된 JWT Access Token (Cookie)</label>
        <span id="tokenDisplay">인증 쿠키 보관 중...</span>
    </div>

    <div class="btn-group">
        <a href="/login" class="btn btn-secondary">다시 로그인</a>
        <form action="/logout" method="post" style="flex: 1; display: flex;">
            <button type="submit" class="btn btn-primary" style="width: 100%;">로그아웃</button>
        </form>
    </div>
</div>

<script>
    // 쿠키에서 accessToken 읽기 시도
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    const token = getCookie('accessToken');
    if (token) {
        document.getElementById('tokenDisplay').innerText = token.substring(0, 35) + '... (보안 보관 중)';
    }
</script>

</body>
</html>
