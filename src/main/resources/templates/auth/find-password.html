<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이메일 본인확인 | MushMush</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <img src="/images/logo1.png" alt="MushMush 로고" class="auth-logo" />

        <div class="auth-body">
            <p class="auth-subtitle">가입하신 이메일로 본인확인을 진행합니다.</p>

            <form id="email-send-form" onsubmit="handleSendEmail(event)">
                <input type="hidden" id="verify-type" th:value="${param.type != null ? param.type[0] : ''}">

                <div class="field">
                    <input type="email" id="verify-email" name="email" placeholder="you@example.com" required />
                </div>

                <button type="submit" class="btn btn-primary">인증번호 받기</button>
            </form>

            <div class="auth-links">
                <a href="/login">로그인으로 돌아가기</a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/auth-find-password.js}"></script>
</body>
</html>
