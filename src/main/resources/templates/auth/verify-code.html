<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인증번호 입력 | MushMush</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <img src="/images/logo1.png" alt="MushMush 로고" class="auth-logo" />

        <div class="auth-body">
            <p class="auth-subtitle">이메일로 인증번호를 발송했습니다.<br />인증번호 6자리를 입력해 주세요.</p>

            <form id="verify-form" onsubmit="handleVerify(event)">
                <!-- 파라미터 또는 모델에서 전달받은 이메일과 타입 확실하게 보장! -->
                <input type="hidden" id="verify-email" th:value="${param.email != null ? param.email[0] : email}" />
                <input type="hidden" id="verify-type" th:value="${param.type != null ? param.type[0] : type}" />

                <div class="field">
                    <input type="text" id="code" name="code" placeholder="인증번호 6자리" maxlength="6" required />
                </div>

                <div class="btn-row">
                    <a href="/find-password" class="btn btn-secondary">이전</a>
                    <button type="submit" class="btn btn-primary">다음</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    async function handleVerify(event) {
        event.preventDefault();

        const email = document.getElementById('verify-email').value;
        const type = document.getElementById('verify-type').value;
        const code = document.getElementById('code').value;

        console.log('인증 시작 -> 이메일:', email, '타입:', type, '인증코드:', code);

        if (!email) {
            alert('이메일 정보가 누락되었습니다. 이메일 입력 화면으로 이동합니다.');
            location.href = '/find-password?type=dormant';
            return;
        }

        try {
            const verifyRes = await fetch(`/users/email/verify?email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`, {
                method: 'POST'
            });
            const isVerified = await verifyRes.json();
            console.log('검증 응답 결과:', isVerified);

            const isSuccess = (isVerified === true || isVerified === "true" || (isVerified && isVerified.data === true));

            if (isSuccess) {
                console.log('인증 성공! 백엔드 휴면 해제 API 호출 시작...');

                const releaseRes = await fetch(`/users/dormant/release?email=${encodeURIComponent(email)}`, {
                    method: 'POST'
                });

                console.log('휴면 해제 응답 상태:', releaseRes.status);

                if (releaseRes.ok) {
                    alert('휴면 계정이 성공적으로 해제되었습니다! 다시 로그인해 주세요.');
                    location.href = '/login';
                } else {
                    alert('휴면 해제 처리 중 오류가 발생했습니다. (상태코드: ' + releaseRes.status + ')');
                }
            } else {
                alert('인증번호가 일치하지 않거나 만료되었습니다. 다시 확인해 주세요.');
            }
        } catch (error) {
            console.error('인증 예외 발생:', error);
            alert('인증 처리 중 오류가 발생했습니다: ' + error.message);
        }
    }
</script>
</body>
</html>
