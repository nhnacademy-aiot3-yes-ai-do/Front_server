<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<header class="topbar" th:fragment="header">
    <div class="topbar-inner">
        <div class="topbar-left">
            <a href="/cultivations" class="topbar-logo-link">
                <img src="/images/logo2.png" alt="MushMush 로고" class="topbar-logo" />
            </a>
        </div>
        <div class="topbar-right">
            <button class="topbar-link" type="button" onclick="location.href='/cultivations/history'">
                <i data-lucide="history"></i><span class="topbar-link-label">재배 이력</span>
            </button>
            <button class="topbar-link" type="button" onclick="location.href='/support'">
                <i data-lucide="message-square"></i><span class="topbar-link-label">회원문의</span>
            </button>

            <div class="topbar-session" id="topbar-session">
                <input type="hidden" id="just-logged-in-flag" th:value="${justLoggedIn}" />
                <i data-lucide="calendar-clock"></i>
                <span class="topbar-session-timer" id="topbar-session-timer">30:00</span>
                <button type="button" class="topbar-session-extend" id="topbar-session-extend" onclick="extendLoginSession()">로그인 연장하기</button>
            </div>

            <span class="topbar-divider"></span>

            <div class="topbar-profile" id="topbar-profile">
                <button class="topbar-profile-trigger" type="button" onclick="toggleTopbarProfile()">
                    <div class="avatar-circle"><i data-lucide="circle-user-round"></i></div>
                    <span class="topbar-nickname" id="topbar-nickname-label"></span>
                    <i data-lucide="chevron-down" class="topbar-profile-chevron"></i>
                </button>
                <div class="topbar-profile-menu">
                    <button class="topbar-profile-menu-item" type="button" onclick="location.href='/mypage'">
                        <i data-lucide="user"></i>내 정보 보기
                    </button>
                    <button class="topbar-profile-menu-item" type="button" onclick="location.href='/mypage/notifications'">
                        <i data-lucide="bell"></i>알림 설정
                    </button>
                    <button class="topbar-profile-menu-item topbar-profile-menu-item-danger" type="button" onclick="logout()">
                        <i data-lucide="log-out"></i>로그아웃
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>

</body>
</html>
