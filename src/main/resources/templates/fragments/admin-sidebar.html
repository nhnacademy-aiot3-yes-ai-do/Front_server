<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="admin-sidebar" th:fragment="adminSidebar(active)">
    <a href="/admin" class="admin-sidebar-brand">
        <img src="/images/logo2.png" alt="MushMush 로고" class="admin-sidebar-logo" />
    </a>

    <nav class="admin-sidebar-nav">
        <div class="admin-sidebar-group">
            <span class="admin-sidebar-group-label">메인</span>
            <a href="/admin" class="admin-sidebar-link" th:classappend="${active == 'dashboard'} ? ' is-active'">
                <i data-lucide="layout-dashboard"></i><span class="admin-sidebar-link-label">대시보드</span>
            </a>
        </div>
        <div class="admin-sidebar-group">
            <span class="admin-sidebar-group-label">관리</span>
            <a href="/admin/members" class="admin-sidebar-link" th:classappend="${active == 'members'} ? ' is-active'">
                <i data-lucide="users"></i><span class="admin-sidebar-link-label">회원 관리</span>
            </a>
            <a href="/admin/inquiries" class="admin-sidebar-link" th:classappend="${active == 'inquiries'} ? ' is-active'">
                <i data-lucide="message-square"></i><span class="admin-sidebar-link-label">회원 문의</span>
            </a>
            <a href="/admin/mushrooms" class="admin-sidebar-link" th:classappend="${active == 'mushrooms'} ? ' is-active'">
                <i data-lucide="package"></i><span class="admin-sidebar-link-label">버섯 등록</span>
            </a>
            <a href="/admin/sensors" class="admin-sidebar-link" th:classappend="${active == 'sensors'} ? ' is-active'">
                <i data-lucide="cpu"></i><span class="admin-sidebar-link-label">센서타입 등록</span>
            </a>
            <a href="/admin/notification-events" class="admin-sidebar-link" th:classappend="${active == 'notification-events'} ? ' is-active'">
                <i data-lucide="bell"></i><span class="admin-sidebar-link-label">알림 이벤트 등록</span>
            </a>
        </div>
    </nav>

    <div class="admin-sidebar-footer">
        <!-- 일반 유저 페이지 헤더(fragments/header.html)의 로그인 남은시간 타이머 + 연장 버튼과
             완전히 동일한 마크업/JS(common.js의 initTopbarSessionTimer/extendLoginSession)를 재사용함.
             id를 그대로 맞춰야 JS가 찾아서 동작하므로 id는 바꾸지 않음. -->
        <div class="topbar-session admin-sidebar-session" id="topbar-session">
            <i data-lucide="calendar-clock"></i>
            <span class="topbar-session-timer" id="topbar-session-timer">30:00</span>
            <button type="button" class="topbar-session-extend" id="topbar-session-extend" onclick="extendLoginSession()">로그인 연장하기</button>
        </div>

        <div class="admin-sidebar-profile">
            <div class="avatar-circle">
                <img id="topbar-profile-image"
                     class="topbar-profile-image"
                     src=""
                     alt="프로필 사진"
                     hidden />

                <i id="topbar-default-icon"
                   data-lucide="circle-user-round"></i>
            </div>
            <span class="admin-sidebar-profile-name">관리자</span>
        </div>
        <button class="admin-sidebar-logout" type="button" onclick="handleLogout()">
            <i data-lucide="log-out"></i><span class="admin-sidebar-logout-label">로그아웃</span>
        </button>
    </div>
</aside>

</body>
</html>
