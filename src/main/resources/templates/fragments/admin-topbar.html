<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<header class="admin-topbar" th:fragment="adminTopbar">
    <div>
        <h1 class="admin-topbar-title">안녕하세요, 관리자님 <span>🌱</span></h1>
        <p class="admin-topbar-desc">MushMush 플랫폼을 효율적으로 관리해보세요.</p>
    </div>

    <div class="admin-topbar-actions">
        <button class="admin-topbar-bell" type="button" onclick="adminComingSoon()" aria-label="알림">
            <i data-lucide="bell"></i>
        </button>
        <div class="admin-topbar-profile">
            <div class="avatar-circle"><i data-lucide="circle-user-round"></i></div>
            <strong>관리자</strong>
            <i data-lucide="chevron-down"></i>
        </div>
    </div>
</header>

</body>
</html>
