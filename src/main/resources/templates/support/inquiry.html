<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원문의 | MushMush</title>
    <link rel="stylesheet" href="/css/support.css" />
    <script src="/js/lucide.js"></script>
    <script src="/js/common.js"></script>
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="page-container">
    <div class="support-panels">

        <!-- 접수 완료 -->
        <section class="support-card support-success" th:if="${submitted}">
            <div class="support-success-icon">
                <i data-lucide="circle-check"></i>
            </div>
            <h2 class="support-title support-title-center">문의가 접수되었어요</h2>
            <p class="support-desc support-desc-center">
                관리자 확인 후 입력하신 이메일로 답변드릴게요.<br />답변까지 며칠 정도 걸릴 수 있어요.
            </p>
            <a class="btn btn-primary support-full-btn" href="/support">
                <i data-lucide="message-square"></i>문의 추가로 남기기
            </a>
        </section>

        <!-- 문의 작성 -->
        <section class="support-card" th:unless="${submitted}">
            <div class="support-heading">
                <i data-lucide="message-square"></i>
                <h2 class="support-title">회원문의</h2>
            </div>
            <p class="support-desc">궁금하신 점이나 불편하신 점을 남겨주시면 관리자가 확인 후 답변드려요.</p>

            <form action="/support" method="post">
                <div class="support-field">
                    <label>문의 유형</label>
                    <select name="category" required>
                        <option value="계정/로그인">계정/로그인</option>
                        <option value="재배 기능">재배 기능</option>
                        <option value="센서/기기">센서/기기</option>
                        <option value="버그 신고">버그 신고</option>
                        <option value="기타">기타</option>
                    </select>
                </div>

                <div class="support-field">
                    <label>제목</label>
                    <input type="text" name="title" placeholder="문의 제목을 입력해주세요" required />
                </div>

                <div class="support-field">
                    <label>문의 내용</label>
                    <textarea name="content" rows="6" placeholder="문의하실 내용을 자세히 적어주세요" required></textarea>
                </div>

                <div class="support-field">
                    <label>답변받을 이메일 (선택)</label>
                    <input type="email" name="contactEmail" placeholder="you@example.com" />
                </div>

                <div class="support-actions">
                    <button class="btn btn-primary support-full-btn" type="submit">
                        <i data-lucide="send"></i>문의 보내기
                    </button>
                </div>
            </form>
        </section>

    </div>
</div>

<script>lucide.createIcons();</script>

</body>
</html>
