<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>접근 권한 없음 | MushMush 관리자</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <script src="/js/lucide.js"></script>
</head>
<body class="error-page">
<div class="error-wrap">
    <div class="error-card">
        <div class="error-icon-wrap">
            <i data-lucide="shield-alert"></i>
        </div>

        <div class="error-code" th:text="'ERROR ' + ${status}">ERROR 403</div>
        <h1 class="error-title">접근 권한이 없어요</h1>
        <p class="error-subtitle">
            관리자 권한이 필요한 페이지예요.<br />
            권한을 확인하거나 관리자 홈으로 돌아가 주세요.
        </p>

        <div class="error-actions">
            <a href="/admin" class="btn btn-outline">관리자 홈으로</a>
            <button type="button" class="btn btn-primary" onclick="location.reload()">다시 시도</button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
</script>
</body>
</html>
