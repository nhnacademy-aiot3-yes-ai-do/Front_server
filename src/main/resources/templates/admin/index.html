<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 | MushMush</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <script th:src="@{/js/lucide.js}"></script>
    <script th:src="@{/js/admin-common.js}"></script>
</head>
<body>

<div class="admin-body-row">
<aside th:replace="~{fragments/admin-sidebar :: adminSidebar('dashboard')}"></aside>

<div class="page-container admin-hub-page">
    <div class="admin-hub-content">

        <div class="admin-welcome">
            <div>
                <div class="admin-welcome-title">안녕하세요, 관리자님</div>
                <p class="admin-welcome-sub">MushMush 플랫폼의 주요 현황을 한눈에 확인해보세요.</p>
            </div>
            <div class="admin-welcome-date" id="admin-today-date"></div>
        </div>

        <div class="admin-hero-panel">
            <div class="admin-hero-title">오늘 확인할 항목이 있어요</div>
            <p class="admin-hero-desc">
                <span th:if="${pendingInquiryCount > 0}">미답변 문의 <span th:text="${pendingInquiryCount}">0</span>건을 확인해 보세요.</span>
                <span th:unless="${pendingInquiryCount > 0}">미답변 문의가 없어요.</span>
                <br />회원·문의·버섯 정보는 왼쪽 메뉴에서 바로 이동할 수 있어요.
            </p>
            <div class="admin-hero-actions">
                <button class="btn btn-primary btn-sm" type="button" onclick="location.href='/admin/inquiries'">
                    <i data-lucide="message-square" style="width:14px;height:14px;"></i>미답변 문의 보기
                </button>
            </div>
        </div>

        <div class="admin-stat-row">
            <div class="admin-stat-card">
                <span class="admin-stat-icon-wrap"><i data-lucide="users"></i></span>
                <div class="admin-stat-card">
                    <span class="admin-stat-icon-wrap"><i data-lucide="users"></i></span>
                    <div>
                        <div class="admin-stat-value" th:text="${totalMemberCount}">12</div>
                        <div class="admin-stat-label">전체 회원</div>
                    </div>
                </div>
            </div>
            <div class="admin-stat-card">
                <span class="admin-stat-icon-wrap"><i data-lucide="message-square"></i></span>
                <div>
                    <div class="admin-stat-value" th:text="${pendingInquiryCount}">5</div>
                    <div class="admin-stat-label">미답변 문의</div>
                </div>
            </div>
            <div class="admin-stat-card">
                <span class="admin-stat-icon-wrap"><i data-lucide="package"></i></span>
                <div>
                    <div class="admin-stat-value" th:text="${mushroomCount}">5</div>
                    <div class="admin-stat-label">등록된 버섯 종류</div>
                </div>
            </div>
        </div>

        <div class="admin-activity-row">
            <div class="admin-activity-panel">
                <div class="admin-activity-head">
                    <span class="admin-activity-title">최근 미답변 문의</span>
                    <a href="/admin/inquiries" class="admin-activity-more">전체보기<i data-lucide="chevron-right"></i></a>
                </div>
                <div class="admin-activity-list">
                    <a class="admin-activity-item" th:href="@{/admin/inquiries(open=${inquiry.id})}"
                       th:each="inquiry : ${pendingInquiries}">
                        <span class="admin-activity-item-icon"><i data-lucide="message-square"></i></span>
                        <div class="admin-activity-item-body">
                            <div class="admin-activity-item-title" th:text="${inquiry.title}">문의 제목</div>
                            <div class="admin-activity-item-meta"
                                 th:text="${inquiry.userNickname} + ' · ' + ${#temporals.format(inquiry.createdAt, 'yyyy.MM.dd')}">nickname · 2026.07.28</div>
                        </div>
                        <span class="status-badge pending">답변대기</span>
                    </a>
                    <div class="admin-activity-empty" th:if="${#lists.isEmpty(pendingInquiries)}">미답변 문의가 없어요.</div>
                </div>
            </div>

            <div class="admin-activity-panel">
                <div class="admin-activity-head">
                    <span class="admin-activity-title">최근 가입 회원</span>
                    <a href="/admin/members" class="admin-activity-more">전체보기<i data-lucide="chevron-right"></i></a>
                </div>
                <div class="admin-activity-list">
                    <div class="admin-activity-item" th:each="member : ${recentMembers}">
                        <span class="admin-activity-item-icon"><i data-lucide="circle-user-round"></i></span>
                        <div class="admin-activity-item-body">
                            <div class="admin-activity-item-title" th:text="${member.nickname}">nickname</div>
                            <div class="admin-activity-item-meta"
                                 th:text="${member.email} + ' · ' + ${#temporals.format(member.createdAt, 'yyyy.MM.dd')} + ' 가입'">nickname@gmail.com · 2026.07.03 가입</div>
                        </div>
                    </div>
                    <div class="admin-activity-empty" th:if="${#lists.isEmpty(recentMembers)}">최근 가입한 회원이 없어요.</div>
                </div>
            </div>
        </div>

    </div>
</div>
</div>

<script th:src="@{/js/admin-index.js}"></script>

</body>
</html>
