<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 | MushMush</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <script src="/js/lucide.js"></script>
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <div class="topbar-left">
            <a href="/admin" class="topbar-logo-link">
                <img src="/images/logo2.png" alt="MushMush 로고" class="topbar-logo" />
            </a>
        </div>
        <div class="topbar-right">
            <button class="topbar-link" type="button" onclick="handleLogout()">
                <i data-lucide="log-out"></i>로그아웃
            </button>
            <span class="topbar-divider"></span>
            <div class="avatar-circle"><i data-lucide="circle-user-round"></i></div>
            <span class="topbar-nickname">관리자</span>
        </div>
    </div>
</header>

<div class="page-container admin-hub-page">

    <div class="admin-hub-grid">
        <div class="admin-hub-tile" onclick="location.href='/admin/members'">
            <i data-lucide="users" class="admin-hub-icon"></i>
            <span class="admin-hub-label">회원 관리</span>
            <span class="admin-hub-desc">가입한 회원 목록을 확인하고<br />활성/탈퇴 상태를 관리해요</span>
        </div>
        <div class="admin-hub-tile" onclick="location.href='/admin/cultivations'">
            <i data-lucide="sprout" class="admin-hub-icon"></i>
            <span class="admin-hub-label">재배지 관리</span>
            <span class="admin-hub-desc">등록된 재배지와 환경 통계를<br />확인하고 필요 시 삭제해요</span>
        </div>
        <div class="admin-hub-tile" onclick="location.href='/admin/inquiries'">
            <i data-lucide="message-square" class="admin-hub-icon"></i>
            <span class="admin-hub-label">회원 문의</span>
            <span class="admin-hub-desc">회원이 남긴 문의 내역을<br />구분별로 확인해요</span>
        </div>
    </div>

</div>

<script>
    lucide.createIcons();

    function handleLogout() {
        fetch('/logout', { method: 'POST' }).finally(function () {
            location.href = '/login';
        });
    }
</script>

</body>
</html>
