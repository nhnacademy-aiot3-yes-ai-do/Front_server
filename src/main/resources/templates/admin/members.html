<!-- templates/admin/members.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원 관리 | MushMush</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <script th:src="@{/js/lucide.js}"></script>
    <script th:src="@{/js/admin-common.js}"></script>
</head>
<body>

<div class="admin-body-row">
<aside th:replace="~{fragments/admin-sidebar :: adminSidebar('members')}"></aside>

<div class="page-container admin-list-page">

    <div class="admin-panel">
        <div class="admin-page-head">
            <button class="admin-back-link" type="button" onclick="location.href='/admin'">
                <i data-lucide="chevron-left"></i>회원 관리
            </button>
            <div class="admin-filters">
                <div class="msh-select msh-select--admin-filter" id="member-sub-select" data-value="active" data-onchange="switchMemberSub">
                    <button type="button" class="msh-select-trigger" onclick="toggleMshSelect(this.parentElement)">
                        <span class="msh-select-value">활성 회원</span>
                        <i data-lucide="chevron-down" class="msh-select-chevron"></i>
                    </button>
                    <div class="msh-select-menu">
                        <div class="msh-select-option selected" data-value="active" onclick="selectMshOption(this)">활성 회원</div>
                        <div class="msh-select-option" data-value="withdrawn" onclick="selectMshOption(this)">탈퇴 회원</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="list-table-wrap">
            <table class="list-table">
                <thead>
                <tr id="member-thead-row">
                    <th>닉네임</th>
                    <th>이메일</th>
                    <th>회원가입일자</th>
                    <th>회원수정일자</th>
                    <th id="member-last-col">마지막 로그인 일자</th>
                </tr>
                </thead>
                <tbody id="member-tbody"></tbody>
            </table>
        </div>

        <div class="admin-pagination" id="member-pagination"></div>
    </div>

</div>
</div>

<script th:src="@{/js/msh-select.js}"></script>
<script th:src="@{/js/admin-members.js}"></script>

</body>
</html>
