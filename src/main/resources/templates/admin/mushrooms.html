<!-- templates/admin/mushrooms.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/favicon-192.png" />
    <title>버섯 등록 | MushMush</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <script src="/js/lucide.js"></script>
    <script src="/js/admin-common.js"></script>
</head>
<body>

<header th:replace="~{fragments/admin-header :: adminHeader}"></header>

<div class="page-container admin-list-page">

    <div class="admin-panel">
        <div class="admin-page-head">
            <button class="admin-back-link" type="button" onclick="location.href='/admin'">
                <i data-lucide="chevron-left"></i>버섯 등록
            </button>
            <div class="admin-filters">
                <button class="btn btn-primary btn-sm" type="button" onclick="openMushroomForm()">
                    <i data-lucide="plus" style="width:14px;height:14px;"></i>새 버섯 등록
                </button>
            </div>
        </div>

        <div class="list-table-wrap">
            <table class="list-table">
                <thead>
                <tr>
                    <th>국문명</th>
                    <th>영문명</th>
                    <th>학명</th>
                    <th>적정 온도</th>
                    <th>적정 습도</th>
                    <th>등록일</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="mushroom-tbody"></tbody>
            </table>
        </div>

        <div class="admin-pagination" id="mushroom-pagination"></div>
    </div>

</div>

<!-- 버섯 등록 / 수정 -->
<div class="modal-overlay" id="modal-mushroom-form">
    <div class="modal-box modal-box-wide">
        <button class="modal-close" type="button" onclick="closeModal('modal-mushroom-form')">
            <i data-lucide="x"></i>
        </button>
        <h3 class="modal-title" id="mushroom-form-title">새 버섯 등록</h3>
        <p class="modal-sub">재배 가능한 버섯 종류와 적정 생육 환경 범위를 등록해요.</p>

        <div class="modal-field-row">
            <div class="modal-field">
                <label>국문명</label>
                <input type="text" id="mf-name-ko" placeholder="예: 양송이버섯" />
            </div>
            <div class="modal-field">
                <label>영문명</label>
                <input type="text" id="mf-name-en" placeholder="예: Button mushroom" />
            </div>
        </div>

        <div class="modal-field">
            <label>학명</label>
            <input type="text" id="mf-scientific" placeholder="예: Agaricus bisporus" />
            <span class="modal-field-hint">재배지 등록 화면과 버섯 종류를 매칭하는 기준값으로도 쓰여요.</span>
        </div>

        <div class="modal-field-row">
            <div class="modal-field">
                <label><i data-lucide="thermometer" style="width:13px;height:13px;vertical-align:-2px;margin-right:4px;color:var(--sage-600);"></i>적정 온도 (°C)</label>
                <div class="modal-range">
                    <input type="number" id="mf-temp-min" placeholder="최소" />
                    <span>~</span>
                    <input type="number" id="mf-temp-max" placeholder="최대" />
                </div>
            </div>
            <div class="modal-field">
                <label><i data-lucide="droplet" style="width:13px;height:13px;vertical-align:-2px;margin-right:4px;color:var(--sage-600);"></i>적정 습도 (%)</label>
                <div class="modal-range">
                    <input type="number" id="mf-humidity-min" placeholder="최소" />
                    <span>~</span>
                    <input type="number" id="mf-humidity-max" placeholder="최대" />
                </div>
            </div>
        </div>

        <div class="modal-field-row">
            <div class="modal-field">
                <label><i data-lucide="cloudy" style="width:13px;height:13px;vertical-align:-2px;margin-right:4px;color:var(--sage-600);"></i>적정 CO2 (ppm)</label>
                <div class="modal-range">
                    <input type="number" id="mf-co2-min" placeholder="최소" />
                    <span>~</span>
                    <input type="number" id="mf-co2-max" placeholder="최대" />
                </div>
            </div>
            <div class="modal-field">
                <label><i data-lucide="sun" style="width:13px;height:13px;vertical-align:-2px;margin-right:4px;color:var(--sage-600);"></i>적정 조도 (lux)</label>
                <div class="modal-range">
                    <input type="number" id="mf-light-min" placeholder="최소" />
                    <span>~</span>
                    <input type="number" id="mf-light-max" placeholder="최대" />
                </div>
            </div>
        </div>

        <p class="modal-form-error" id="mushroom-form-error" style="display:none;">국문명은 필수로 입력해 주세요.</p>

        <div class="modal-actions">
            <button class="btn btn-outline" type="button" onclick="closeModal('modal-mushroom-form')">취소</button>
            <button class="btn btn-primary" type="button" onclick="saveMushroomForm()">저장</button>
        </div>
    </div>
</div>

<!-- 버섯 삭제 확인 -->
<div class="modal-overlay" id="modal-mushroom-delete">
    <div class="modal-box">
        <h3 class="modal-title">이 버섯 정보를 삭제하겠습니까?</h3>
        <p class="modal-sub">삭제하면 재배지 등록 화면에서도 더 이상 선택할 수 없어요.</p>
        <div class="modal-actions">
            <button class="btn btn-outline" type="button" onclick="closeModal('modal-mushroom-delete')">취소</button>
            <button class="btn btn-danger" type="button" onclick="confirmDeleteMushroom()">삭제</button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    // ===== 버섯 등록 (데모 데이터) =====
    // 재배지 등록 화면(cultivation/create.html)에서 하드코딩된 5종과 이름을 맞춰뒀음.
    // 실제로는 Cultivation_server의 /api/v1/mushroom-references CRUD를 그대로 붙이면 됨.
    var MUSHROOMS = [
        { id: 1, nameKo: '양송이버섯', nameEn: 'Button mushroom', scientific: 'Agaricus bisporus', tempMin: 16, tempMax: 20, humidityMin: 60, humidityMax: 70, co2Min: 400, co2Max: 600, lightMin: 200, lightMax: 400, registered: '2026.01.10' },
        { id: 2, nameKo: '느타리버섯', nameEn: 'Oyster mushroom', scientific: 'Pleurotus ostreatus', tempMin: 13, tempMax: 18, humidityMin: 65, humidityMax: 80, co2Min: 400, co2Max: 550, lightMin: 250, lightMax: 450, registered: '2026.01.10' },
        { id: 3, nameKo: '표고버섯', nameEn: 'Shiitake', scientific: 'Lentinula edodes', tempMin: 15, tempMax: 20, humidityMin: 60, humidityMax: 75, co2Min: 400, co2Max: 600, lightMin: 200, lightMax: 350, registered: '2026.01.15' },
        { id: 4, nameKo: '새송이버섯', nameEn: 'King oyster mushroom', scientific: 'Pleurotus eryngii', tempMin: 14, tempMax: 18, humidityMin: 60, humidityMax: 75, co2Min: 400, co2Max: 550, lightMin: 200, lightMax: 350, registered: '2026.02.01' },
        { id: 5, nameKo: '팽이버섯', nameEn: 'Enoki mushroom', scientific: 'Flammulina velutipes', tempMin: 8, tempMax: 14, humidityMin: 65, humidityMax: 80, co2Min: 450, co2Max: 650, lightMin: 50, lightMax: 150, registered: '2026.02.20' }
    ];

    var mushroomPage = 1;
    var MUSHROOM_PAGE_SIZE = 8;
    var currentMushroomId = null;

    function renderMushrooms() {
        var totalPages = Math.max(1, Math.ceil(MUSHROOMS.length / MUSHROOM_PAGE_SIZE));
        if (mushroomPage > totalPages) mushroomPage = totalPages;

        var start = (mushroomPage - 1) * MUSHROOM_PAGE_SIZE;
        var pageData = MUSHROOMS.slice(start, start + MUSHROOM_PAGE_SIZE);

        var tbody = document.getElementById('mushroom-tbody');
        tbody.innerHTML = '';
        pageData.forEach(function (m) {
            var tr = document.createElement('tr');
            tr.className = 'readonly';
            tr.innerHTML =
                '<td>' + m.nameKo + '</td>' +
                '<td>' + m.nameEn + '</td>' +
                '<td style="font-style:italic;color:var(--brown-500);">' + m.scientific + '</td>' +
                '<td>' + m.tempMin + '~' + m.tempMax + '°C</td>' +
                '<td>' + m.humidityMin + '~' + m.humidityMax + '%</td>' +
                '<td>' + m.registered + '</td>' +
                '<td>' +
                '<button class="row-action-btn" type="button" title="수정" onclick="openMushroomForm(' + m.id + ')"><i data-lucide="pencil"></i></button>' +
                '<button class="row-action-btn" type="button" title="삭제" onclick="openDeleteMushroom(' + m.id + ')"><i data-lucide="shield-alert"></i></button>' +
                '</td>';
            tbody.appendChild(tr);
        });

        renderMushroomPagination(totalPages);
        lucide.createIcons();
    }

    function goToMushroomPage(page) {
        mushroomPage = page;
        renderMushrooms();
    }

    function renderMushroomPagination(totalPages) {
        var wrap = document.getElementById('mushroom-pagination');
        if (totalPages <= 1) { wrap.innerHTML = ''; return; }

        var prevDisabled = mushroomPage === 1 ? ' disabled' : '';
        var nextDisabled = mushroomPage === totalPages ? ' disabled' : '';
        wrap.innerHTML =
            '<button class="admin-page-btn' + prevDisabled + '" type="button" onclick="goToMushroomPage(' + (mushroomPage - 1) + ')"><i data-lucide="chevron-left"></i></button>' +
            '<span class="admin-page-label">' + mushroomPage + ' / ' + totalPages + '</span>' +
            '<button class="admin-page-btn' + nextDisabled + '" type="button" onclick="goToMushroomPage(' + (mushroomPage + 1) + ')"><i data-lucide="chevron-right"></i></button>';
    }

    function openMushroomForm(id) {
        currentMushroomId = id || null;
        document.getElementById('mushroom-form-error').style.display = 'none';

        var m = id ? MUSHROOMS.filter(function (x) { return x.id === id; })[0] : null;

        document.getElementById('mushroom-form-title').textContent = m ? '버섯 정보 수정' : '새 버섯 등록';
        document.getElementById('mf-name-ko').value = m ? m.nameKo : '';
        document.getElementById('mf-name-en').value = m ? m.nameEn : '';
        document.getElementById('mf-scientific').value = m ? m.scientific : '';
        document.getElementById('mf-temp-min').value = m ? m.tempMin : '';
        document.getElementById('mf-temp-max').value = m ? m.tempMax : '';
        document.getElementById('mf-humidity-min').value = m ? m.humidityMin : '';
        document.getElementById('mf-humidity-max').value = m ? m.humidityMax : '';
        document.getElementById('mf-co2-min').value = m ? m.co2Min : '';
        document.getElementById('mf-co2-max').value = m ? m.co2Max : '';
        document.getElementById('mf-light-min').value = m ? m.lightMin : '';
        document.getElementById('mf-light-max').value = m ? m.lightMax : '';

        openModal('modal-mushroom-form');
    }

    function todayLabel() {
        var d = new Date();
        return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
    }

    // 데모: 실제로는 Cultivation_server의 mushroom-references API로 저장 요청을 보내야 함
    function saveMushroomForm() {
        var nameKo = document.getElementById('mf-name-ko').value.trim();
        if (!nameKo) {
            document.getElementById('mushroom-form-error').style.display = 'block';
            return;
        }

        var payload = {
            nameKo: nameKo,
            nameEn: document.getElementById('mf-name-en').value.trim(),
            scientific: document.getElementById('mf-scientific').value.trim(),
            tempMin: Number(document.getElementById('mf-temp-min').value) || 0,
            tempMax: Number(document.getElementById('mf-temp-max').value) || 0,
            humidityMin: Number(document.getElementById('mf-humidity-min').value) || 0,
            humidityMax: Number(document.getElementById('mf-humidity-max').value) || 0,
            co2Min: Number(document.getElementById('mf-co2-min').value) || 0,
            co2Max: Number(document.getElementById('mf-co2-max').value) || 0,
            lightMin: Number(document.getElementById('mf-light-min').value) || 0,
            lightMax: Number(document.getElementById('mf-light-max').value) || 0
        };

        if (currentMushroomId) {
            var target = MUSHROOMS.filter(function (x) { return x.id === currentMushroomId; })[0];
            Object.assign(target, payload);
        } else {
            var nextId = MUSHROOMS.reduce(function (max, x) { return Math.max(max, x.id); }, 0) + 1;
            payload.id = nextId;
            payload.registered = todayLabel();
            MUSHROOMS.push(payload);
            mushroomPage = Math.max(1, Math.ceil(MUSHROOMS.length / MUSHROOM_PAGE_SIZE));
        }

        renderMushrooms();
        closeModal('modal-mushroom-form');
    }

    function openDeleteMushroom(id) {
        currentMushroomId = id;
        openModal('modal-mushroom-delete');
    }

    function confirmDeleteMushroom() {
        MUSHROOMS = MUSHROOMS.filter(function (x) { return x.id !== currentMushroomId; });
        renderMushrooms();
        closeModal('modal-mushroom-delete');
    }

    renderMushrooms();
</script>

</body>
</html>
