<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 정보 | MushMush</title>
    <link rel="stylesheet" th:href="@{/css/user-profile.css}" />
    <script th:src="@{/js/common/lucide.js}"></script>
    <script th:src="@{/js/common/common.js}"></script>
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="page-container">
    <div class="profile-panels">

        <section id="profile-view" class="profile-panel active">
            <div class="profile-card">
                <div class="profile-avatar"><i data-lucide="circle-user-round" style="width:40px;height:40px;"></i></div>
                <h2 class="profile-name" id="profile-view-nickname">오인택</h2>

                <div class="info-rows">
                    <div class="info-row">
                        <span class="info-label"><i data-lucide="mail"></i>이메일</span>
                        <span class="info-value" id="profile-view-email">user@example.com</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i data-lucide="user"></i>닉네임</span>
                        <span class="info-value" id="profile-view-nickname-row">오인택</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i data-lucide="calendar-plus"></i>가입일</span>
                        <span class="info-value" id="profile-view-joined-at"></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i data-lucide="calendar-clock"></i>최종 수정일</span>
                        <span class="info-value" id="profile-view-updated-at"></span>
                    </div>
                </div>

                <button class="btn btn-primary profile-full-btn" type="button" onclick="startProfileEdit()">
                    <i data-lucide="pencil"></i>회원정보 수정
                </button>

                <button id="change-password-button" class="btn btn-outline profile-full-btn" type="button" onclick="startPasswordChange()">
                    <i data-lucide="key-round"></i>비밀번호 변경
                </button>

                <button class="profile-delete-link"
                        type="button"
                        onclick="startProfileDelete()">
                    회원 탈퇴
                </button>
            </div>
        </section>


        <section id="profile-edit" class="profile-panel">
            <div class="profile-card">
                <h3 class="modal-title">회원정보 수정</h3>
                <p class="modal-desc">닉네임을 수정할 수 있어요.</p>

                <div class="modal-field">
                    <label for="profile-edit-nickname">닉네임</label>
                    <input type="text"
                           id="profile-edit-nickname"
                           placeholder="닉네임을 입력하세요" />
                </div>

                <p class="profile-error" id="profile-edit-error" style="display:none;"></p>

                <div class="modal-actions">
                    <button class="btn btn-outline" type="button"
                            onclick="cancelProfileEdit()">취소</button>
                    <button class="btn btn-primary" type="button"
                            onclick="saveProfileEdit()">저장</button>
                </div>
            </div>
        </section>

        <section id="password-change" class="profile-panel">
            <div class="profile-card">
                <h3 class="modal-title">비밀번호 변경</h3>
                <p class="modal-desc">
                    안전한 비밀번호를 위해 현재 비밀번호를 먼저 확인해주세요.
                </p>

                <div class="modal-field">
                    <label for="password-change-current">현재 비밀번호</label>
                    <input type="password"
                           id="password-change-current"
                           placeholder="현재 비밀번호" />
                </div>

                <div class="modal-field">
                    <label for="password-change-new">새 비밀번호</label>
                    <input type="password"
                           id="password-change-new"
                           placeholder="새 비밀번호" />
                </div>

                <div class="modal-field">
                    <label for="password-change-confirm">새 비밀번호 확인</label>
                    <input type="password"
                           id="password-change-confirm"
                           placeholder="새 비밀번호를 다시 입력하세요" />
                </div>

                <p class="profile-error"
                   id="password-change-error"
                   style="display:none;"></p>

                <div class="modal-actions">
                    <button class="btn btn-outline"
                            type="button"
                            onclick="cancelProfileEdit()">취소</button>
                    <button class="btn btn-primary"
                            type="button"
                            onclick="savePasswordChange()">비밀번호 변경</button>
                </div>
            </div>
        </section>

        <section id="profile-delete-confirm" class="profile-panel">
            <div class="profile-card">
                <div class="delete-warning-icon">
                    <i data-lucide="triangle-alert"></i>
                </div>
                <h3 class="modal-title profile-title-center">정말 탈퇴하시겠어요?</h3>
                <div class="delete-warning-box">
                    탈퇴하면 재배지, 센서, 재배 이력 등 모든 데이터가 삭제되며 복구할 수 없어요.
                </div>
                <div class="modal-field">
                    <label for="profile-delete-password">비밀번호 확인</label>
                    <input type="password" id="profile-delete-password" placeholder="비밀번호 입력" />
                </div>
                <p class="profile-error" id="profile-delete-error" style="display:none;">비밀번호가 일치하지 않습니다.</p>
                <div class="modal-actions">
                    <button class="btn btn-outline" type="button" onclick="cancelProfileEdit()">취소</button>
                    <button class="btn btn-danger" type="button" onclick="confirmProfileDelete()">탈퇴하기</button>
                </div>
            </div>
        </section>

    </div>
</div>

<script th:src="@{/js/user-profile.js}"></script>

</body>
</html>
