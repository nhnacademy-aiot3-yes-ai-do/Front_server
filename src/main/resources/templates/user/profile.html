<!-- templates/user/profile.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 정보 | MushMush</title>
    <link rel="stylesheet" href="/css/user-profile.css" />
    <script src="/js/lucide.js"></script>
    <script src="/js/common.js"></script>
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="page-container">
    <div class="profile-panels">

        <!-- 내 정보 보기 -->
        <section id="profile-view" class="profile-panel active">
            <div class="profile-card">
                <div class="profile-avatar"><i data-lucide="circle-user-round" style="width:40px;height:40px;"></i></div>
                <h2 class="profile-name" id="profile-view-nickname">오인택</h2>

                <div class="info-rows">
                    <div class="info-row">
                        <span class="info-label"><i data-lucide="mail"></i>이메일</span>
                        <span class="info-value" id="profile-view-email">user@example.com</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i data-lucide="user"></i>닉네임</span>
                        <span class="info-value" id="profile-view-nickname-row">오인택</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i data-lucide="calendar-plus"></i>가입일</span>
                        <span class="info-value" id="profile-view-joined-at"></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i data-lucide="calendar-clock"></i>최종 수정일</span>
                        <span class="info-value" id="profile-view-updated-at"></span>
                    </div>
                </div>

                <button class="btn btn-primary profile-full-btn" type="button" onclick="startProfileEdit()">
                    <i data-lucide="pencil"></i>회원정보 수정
                </button>
                <button class="profile-delete-link" type="button" onclick="startProfileDelete()">
                    회원 탈퇴
                </button>
            </div>
        </section>

        <!-- 비밀번호 확인 -->
        <section id="profile-verify" class="profile-panel">
            <div class="profile-card">
                <h3 class="modal-title">비밀번호 확인</h3>
                <p class="modal-desc">회원정보를 수정하려면 현재 비밀번호를 입력해주세요.</p>
                <div class="modal-field">
                    <label for="profile-verify-password">비밀번호</label>
                    <input type="password" id="profile-verify-password" placeholder="비밀번호 입력" />
                </div>
                <p class="profile-error" id="profile-verify-error" style="display:none;">비밀번호가 일치하지 않습니다.</p>
                <div class="modal-actions">
                    <button class="btn btn-outline" type="button" onclick="cancelProfileEdit()">취소</button>
                    <button class="btn btn-primary" type="button" onclick="confirmProfilePassword()">확인</button>
                </div>
            </div>
        </section>

        <!-- 회원정보 수정 -->
        <section id="profile-edit" class="profile-panel">
            <div class="profile-card">
                <h3 class="modal-title">회원정보 수정</h3>
                <div class="modal-field">
                    <label for="profile-edit-nickname">닉네임</label>
                    <input type="text" id="profile-edit-nickname" placeholder="닉네임을 입력하세요" />
                </div>
                <div class="modal-field">
                    <label for="profile-edit-password">새 비밀번호 (변경할 때만 입력)</label>
                    <input type="password" id="profile-edit-password" placeholder="새 비밀번호" />
                </div>
                <div class="modal-field">
                    <label for="profile-edit-password-confirm">새 비밀번호 확인</label>
                    <input type="password" id="profile-edit-password-confirm" placeholder="새 비밀번호 확인" />
                </div>
                <p class="profile-error" id="profile-edit-error" style="display:none;"></p>
                <div class="modal-actions">
                    <button class="btn btn-outline" type="button" onclick="cancelProfileEdit()">취소</button>
                    <button class="btn btn-primary" type="button" onclick="saveProfileEdit()">저장</button>
                </div>
            </div>
        </section>

        <!-- 회원 탈퇴 -->
        <section id="profile-delete-confirm" class="profile-panel">
            <div class="profile-card">
                <div class="delete-warning-icon">
                    <i data-lucide="triangle-alert"></i>
                </div>
                <h3 class="modal-title profile-title-center">정말 탈퇴하시겠어요?</h3>
                <div class="delete-warning-box">
                    탈퇴하면 재배지, 센서, 재배 이력 등 모든 데이터가 삭제되며 복구할 수 없어요.
                </div>
                <div class="modal-field">
                    <label for="profile-delete-password">비밀번호 확인</label>
                    <input type="password" id="profile-delete-password" placeholder="비밀번호 입력" />
                </div>
                <p class="profile-error" id="profile-delete-error" style="display:none;">비밀번호가 일치하지 않습니다.</p>
                <div class="modal-actions">
                    <button class="btn btn-outline" type="button" onclick="cancelProfileEdit()">취소</button>
                    <button class="btn btn-danger" type="button" onclick="confirmProfileDelete()">탈퇴하기</button>
                </div>
            </div>
        </section>

    </div>
</div>

<script>
    lucide.createIcons();

    const showError = (el, msg) => {
        if (!el) return;
        el.textContent = msg;
        el.style.display = 'block';
    };

    const hideError = (el) => {
        if (!el) return;
        el.style.display = 'none';
    };

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('/users/mypage');
            const result = await res.json();
            if (!res.ok || !result.success) {
                alert('로그인이 필요한 서비스입니다.');
                location.href = '/login';
                return;
            }
            const user = result.data;
            document.getElementById('profile-view-nickname').textContent = user.nickname || '';
            document.getElementById('profile-view-nickname-row').textContent = user.nickname || '';
            document.getElementById('profile-view-email').textContent = user.email || '';
            document.getElementById('profile-view-joined-at').textContent = user.createdAt ? user.createdAt.substring(0, 10) : '';
            document.getElementById('profile-view-updated-at').textContent = user.updatedAt ? user.updatedAt.substring(0, 10) : '';
        } catch {
            location.href = '/login';
        }
    });

    function showProfilePanel(id) {
        document.querySelectorAll('.profile-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startProfileEdit() {
        document.getElementById('profile-verify-password').value = '';
        hideError(document.getElementById('profile-verify-error'));
        showProfilePanel('profile-verify');
    }

    async function confirmProfilePassword() {
        const input = document.getElementById('profile-verify-password').value;
        const errorEl = document.getElementById('profile-verify-error');

        if (!input) {
            showError(errorEl, '비밀번호를 입력해주세요.');
            return;
        }

        try {
            const res = await fetch('/users/verify-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: input })
            });
            const result = await res.json();

            if (!res.ok || !result.success || result.data !== true) {
                showError(errorEl, result.message || '비밀번호가 일치하지 않습니다.');
                return;
            }

            document.getElementById('profile-edit-nickname').value = document.getElementById('profile-view-nickname').textContent;
            document.getElementById('profile-edit-password').value = '';
            document.getElementById('profile-edit-password-confirm').value = '';
            hideError(document.getElementById('profile-edit-error'));
            showProfilePanel('profile-edit');
        } catch {
            showError(errorEl, '비밀번호 확인 중 오류가 발생했습니다.');
        }
    }

    function cancelProfileEdit() {
        showProfilePanel('profile-view');
    }

    async function saveProfileEdit() {
        const nickname = document.getElementById('profile-edit-nickname').value.trim();
        const currentPassword = document.getElementById('profile-verify-password').value;
        const newPassword = document.getElementById('profile-edit-password').value;
        const passwordConfirm = document.getElementById('profile-edit-password-confirm').value;
        const errorEl = document.getElementById('profile-edit-error');

        if (!nickname) {
            showError(errorEl, '닉네임을 입력해주세요.');
            return;
        }

        if (newPassword || passwordConfirm) {
            if (newPassword !== passwordConfirm) {
                showError(errorEl, '새 비밀번호가 일치하지 않습니다.');
                return;
            }
        }

        try {
            const res = await fetch('/users/mypage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nickname, currentPassword, newPassword })
            });
            const result = await res.json();
            if (!res.ok || !result.success) {
                if (res.status === 401 || result.message?.includes('로그인')) {
                    alert('세션이 만료되었습니다. 다시 로그인해 주세요.');
                    location.href = '/login';
                    return;
                }
                showError(errorEl, result.message || '수정에 실패했습니다.');
                return;
            }
            sessionStorage.setItem('mm_user_nickname', nickname);
            const nicknameLabel = document.getElementById('topbar-nickname-label');
            if (nicknameLabel) nicknameLabel.textContent = nickname;

            alert('프로필이 성공적으로 수정되었습니다!');
            location.reload();
        } catch {
            showError(errorEl, '서버 통신 중 오류가 발생했습니다.');
        }

    }

    function startProfileDelete() {
        document.getElementById('profile-delete-password').value = '';
        hideError(document.getElementById('profile-delete-error'));
        showProfilePanel('profile-delete-confirm');
    }

    async function confirmProfileDelete() {
        const input = document.getElementById('profile-delete-password').value;
        const errorEl = document.getElementById('profile-delete-error');

        if (!input) {
            showError(errorEl, '비밀번호를 입력해주세요.');
            return;
        }
        try {
            const res = await fetch('/users/verify-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: input })
            });
            const result = await res.json();

            if (!res.ok || !result.success || result.data !== true) {
                showError(errorEl, result.message || '비밀번호가 일치하지 않습니다.');
                return;
            }

            await fetch('/logout', {method: 'POST'});
            alert('회원 탈퇴가 완료되었습니다. 그동안 이용해 주셔서 감사합니다.')
            location.href = '/login';

        } catch {
            showError(errorEl, '비밀번호 확인 중 오류가 발생했습니다.');
        }

    }
</script>

</body>
</html>
